  return [src];
}

// A fn body form is "real" (not meta) if it is a list starting with a sym
// that is not a kw, or is a num/sym that isn't preceded by a kw (i.e., a
// lone sym or num expression). Meta forms are kw/sym pairs or bare kws.
// Simplest heuristic: a fn is primitive if ALL body forms are kw atoms or
// syms that look like meta values, OR the body is empty.
// A non-primitive fn has at least one list or a lone sym/num that is
// the return expression.
function isPrimitiveFn(bodyForms) {
  if (bodyForms.length === 0) return true;
  // Walk through pairs: if a form is a kw, the next is its value (meta pair).
  // If a non-kw form appears outside a meta-pair position, it's a real body.
  let i = 0;
  while (i < bodyForms.length) {
    const f = bodyForms[i];
    if (f.t === 'kw') {
      // meta key; skip the value if present
      i++;
      if (i < bodyForms.length && bodyForms[i].t !== 'kw') i++; // skip value
      continue;
    }
    // Not a kw -- this is a real expression form.
    return false;
  }
  return true;
}

// Parse (fn (...) ...) param list into {inputs, outputs}.
function parseFnParams(listItems) {
  const inputs = [];
  const outputs = [];
  let inOutputs = false;
  for (const item of listItems) {
    if (item.t === 'sym' && item.s === '=>') { inOutputs = true; continue; }
    const name = item.t === 'kw' ? item.s : item.t === 'sym' ? item.s : null;
    if (name === null) continue;
    if (inOutputs) outputs.push(name);
    else inputs.push(name);
  }
  return { inputs, outputs };
}

// Split expanded arg list into positional and keyword args.
function splitArgs(argNodes) {
  const positional = [];
  const kwargs = Object.create(null);
  let i = 0;
  while (i < argNodes.length) {
    const a = argNodes[i];
    if (a && a.t === 'kw') {
      const key = a.s;
      if (i + 1 < argNodes.length && argNodes[i + 1].t !== 'kw') {
        const val = argNodes[i + 1];
        // Kwarg passthrough: an unset optional forwarded as `:key key` expands to
        // a bare self-named symbol (the param was never bound). Drop it so
        // "optional" carries through a fn body. A mistyped `:key other` keeps its
        // mismatched symbol and still surfaces, so this does not mask typos.
        if (!(val.t === 'sym' && val.s === key)) kwargs[key] = val;
        i += 2;
      } else {
        kwargs[key] = { t: 'flag' };
        i++;
      }
    } else {
      positional.push(a);
      i++;
    }
  }
  return { positional, kwargs };
}

// Thread positional stage-forms right-to-left into one nested form: the
// rightmost is the source; each stage to its left receives the running signal
// as its first input. `(<- out (vca amp) (lpf :cut c) osc)` becomes
// `(vca (lpf osc :cut c) amp)`. A bare symbol stage applies to the signal.
function threadStages(stages) {
  let sig = stages[stages.length - 1];
  for (let i = stages.length - 2; i >= 0; i--) {
    const stage = stages[i];
    if (stage.t === 'list' && stage.items.length > 0) {
      sig = { t: 'list', items: [stage.items[0], sig, ...stage.items.slice(1)] };
    } else {
      sig = { t: 'list', items: [stage, sig] };
    }
  }
  return sig;
}

// Resolve a score/notes item sym through env; _ and ~ stay as syms (rest/tie).
function expandScoreItem(node, env) {
  if (node.t === 'sym' && node.s !== '_' && node.s !== '~') {
    const r = envLookup(env, node.s);
    if (r.found) return r.value;
    throw new Error(`unknown name: ${node.s}`);
  }
  return node;
}

function expandQuoteItems(quoteNode, forNotes, env) {
  if (!forNotes) return quoteNode.items;
  return quoteNode.items.map(it => expandScoreItem(it, env));
}

// Instantiate one op-lens cell with :on and any extra kwargs bound.
// cell must be a fn node. extraKwargs maps kwarg name -> expanded node.
// Validates that fn's extra inputs (beyond inputs[0]) are covered by extraKwargs.
function expandOpLensCell(cell, onArg, cellIdx, ctx, extraKwargs) {
  if (!cell || cell.t !== 'fn') {
    throw new Error(`lens cell [${cellIdx}]: expected a fn, got ${cell && cell.t}`);
  }
  const inputs = cell.params && cell.params.inputs ? cell.params.inputs : [];
  if (inputs.length === 0) {
    throw new Error(`lens cell [${cellIdx}] fn must have at least one input; got 0`);
  }
  const extra = extraKwargs || {};
  // inputs[1..] must all be satisfied by extraKwargs.
  for (let k = 1; k < inputs.length; k++) {
    const name = inputs[k];
    if (!Object.prototype.hasOwnProperty.call(extra, name)) {
      throw new Error(
        `lens cell [${cellIdx}] fn requires kwarg :${name} which is not forwarded by thru`
      );
    }
  }
  // Check that every forwarded kwarg is declared by this fn (inputs[1..]).
  const extraInputNames = new Set(inputs.slice(1));
  for (const k of Object.keys(extra)) {
    if (!extraInputNames.has(k)) {
      throw new Error(
        `lens cell [${cellIdx}] fn does not declare forwarded kwarg :${k}`
      );
    }
  }
  const callFrame = makeEnv(cell.env);
  envBind(callFrame, inputs[0], onArg);
  for (const [k, v] of Object.entries(extra)) {
    envBind(callFrame, k, v);
  }
  return expandFnBodySingle(cell.body, callFrame, ctx);
}

// Classify expanded lens items.
// Returns {t:'lens', items, names} for all-data, {t:'oplens', cells, names} for op or mixed.
// Throws on empty lens only. Arity is checked at thru-expansion time when kwargs are known.
// names: original sym strings before resolution, used by tape subkind resolution.
function classifyLens(resolved, origNames) {
  if (resolved.length === 0) throw new Error('lens: must have at least one cell');
  const hasFn = resolved.some(item => item.t === 'fn');
  if (hasFn) {
    const node = { t: 'oplens', cells: resolved };
    if (origNames) node.names = origNames;
    return node;
  }
  const node = { t: 'lens', items: resolved };
  if (origNames) node.names = origNames;
  return node;
}

// Resolve the LIST argument of (thru LIST IDX) to a lens or oplens node.
// Accepts a quoted list (cells resolved through env / note names), an already
// resolved lens/oplens node, or a sym bound to one. Throws on a mixed fn/value
// list (apply-or-not is undecidable).
function resolveThruList(listNode, env, ctx) {
  let resolved = listNode;
  if (resolved && resolved.t === 'quote') {
    const cells = resolved.items.map(it => {
      if (it.t === 'sym') {
        const r = envLookup(env, it.s);
        if (r.found) return r.value;
      }
      return it;
    });
    resolved = classifyLens(cells, resolved.items.map(it => (it.t === 'sym' ? it.s : null)));
  }
  if (!resolved) throw new Error('thru: list argument is missing');
  // A tape is a dynamic data buffer; thru reads cells from it just like a data lens.
  if (resolved.t === 'tape') return resolved;
  if (resolved.t === 'lens' || resolved.t === 'oplens') {
    // Homogeneity: classifyLens already split all-fn (oplens) from any-non-fn (lens).
    // Catch the genuinely mixed case (some fns, some values) here.
    if (resolved.t === 'oplens') {
      const hasValue = resolved.cells.some(c => c.t !== 'fn');
      if (hasValue) {
        throw new Error('thru: list mixes fn and value cells; a list must be all-fns or all-values');
      }
    }
    return resolved;
  }
  throw new Error(`thru: list argument must be a list/lens, got ${resolved.t}`);
}

// Build the thru result node from a resolved list + index. Out-of-range index
// wraps (floored modulo) in the opthru/op_thru lowering.
// Op-lens: returns an 'oplens-sel' node remembering the cells + index. Applying
// it (call-head position, applyOplensSel) inlines the picked cell over the args;
// using it as a value lowers to its index. Data lens/tape: the IDX-th value.
function buildThru(listResolved, atArg) {
  if (listResolved.t === 'oplens') {
    return { t: 'oplens-sel', cells: listResolved.cells, at: atArg };
  }
  // A lens whose cells are tapes is a collection of buffers, not of values. The
  // pick is a tape, so it cannot decode to one value: remember the cells + index
  // as a buflens-sel and distribute the consuming op over the cells (the op runs
  // once per tape, op_thru picks the output) when this is used as a call arg.
  if (listResolved.t === 'lens' && isBufferLens(listResolved)) {
    return { t: 'buflens-sel', cells: listResolved.items, at: atArg };
  }
  // A lens of computed values (anything other than plain numeric data) is selected
  // with an if-tree mux that reads each value as a live input. A pure-number lens
  // (a scale, etc.) stays a data thru: op_thru decodes one cell from the buffer.
  if (listResolved.t === 'lens' && !listResolved.items.every(it => it && it.t === 'num')) {
    return { t: 'opthru', results: listResolved.items, at: atArg };
  }
  return { t: 'call', op: 'thru', args: [listResolved, atArg], kwargs: {} };
}

// A lens whose cells are all tapes (dynamic buffers), distinct from a data lens
// whose cells are numbers (a scale, decoded to a value by op_thru).
function isBufferLens(lensNode) {
  return lensNode.items.length > 0
    && lensNode.items.every(it => it && (it.t === 'tape' || it.t === 'audio'));
}

// Distribute a primitive call over a buflens-sel argument: the call is rebuilt
// once per tape cell with that arg replaced, and op_thru picks the result value
// at the selection index. All cells run in lockstep; switching the index swaps
// which output is read (a stateless demux, the analog "all voices run" model).
function distributeBufLensSel(name, positional, kwargs, ctx) {
  const ai = positional.findIndex(a => a && a.t === 'buflens-sel');
  if (ai < 0) return null;
  const sel = positional[ai];
  const results = sel.cells.map(cell => {
    const args = positional.slice();
    args[ai] = cell;
    return { t: 'call', op: name, args, kwargs };
  });
  return { t: 'opthru', results, at: sel.at };
}

// Apply an 'oplens-sel' to call args: inline each cell over the first positional
// argument, forwarding extra kwargs to each fn cell. Returns an 'opthru' node.
function applyOplensSel(sel, positional, kwargs, ctx) {
  const onArg = positional[0];
  if (!onArg) throw new Error('thru: applied op-lens needs at least one argument');
  const results = sel.cells.map((cell, i) => expandOpLensCell(cell, onArg, i, ctx, kwargs || {}));
  return { t: 'opthru', results, at: sel.at };
}

// Main node expander.
function expandNode(node, env, ctx) {
  const { report } = ctx;

  if (node.t === 'num' || node.t === 'kw' || node.t === 'flag') return node;

  if (node.t === 'sym') {
    const r = envLookup(env, node.s);
    if (r.found) return r.value;
    // Unresolved sym: return as-is so kwarg passthrough (:key key) can drop it.
    // Any sym that reaches the lowerer without being dropped will error there.
    return node;
  }

  if (node.t === 'quote') return node; // bare quoted list

  if (node.t !== 'list') return node;

  const items = node.items;
  if (items.length === 0) return node;

  const head = items[0];
  if (head.t !== 'sym') {
    // Collections-are-functions: a head of (thru OPLENS IDX) -- or its sugar
    // (squint OPLENS SEL) -- applied to args means "the IDX-th op-lens cell
    // applied to the args". The head expands to an 'oplens-sel' which we apply
    // here via the opthru machinery (applyOplensSel builds the op_thru node).
    if (head.t === 'list') {
      const headExpanded = expandNode(head, env, ctx);
      if (headExpanded && headExpanded.t === 'oplens-sel') {
        const callArgs = items.slice(1).map(it => (it.t === 'kw' ? it : expandNode(it, env, ctx)));
        const { positional, kwargs } = splitArgs(callArgs);
        return applyOplensSel(headExpanded, positional, kwargs, ctx);
      }
      // Inline port-select: a multi-output call as the head, e.g. ((phasor ..) :tick)
      // or ((vcf ..) :hp), picks a port without binding the call first.
      if (headExpanded && headExpanded.t === 'outputs') {
        return expandPortSelect(headExpanded, items.slice(1), env, ctx);
      }
      // A thru/squint head applied to args but it picks values, not fns: error.
      const headSym = head.items[0] && head.items[0].t === 'sym' ? head.items[0].s : null;
      if (headSym === 'thru' || headSym === 'squint') {
        throw new Error(
          `${headSym}: only an op-lens (all-fn list) can be applied to arguments; this list holds values`
        );
      }
    }
    // Non-sym head -- expand as generic list
    return { t: 'call', op: '?', args: items.slice(1).map(it => expandNode(it, env, ctx)) };
  }

  const name = head.s;

  // Special forms.

  if (name === 'fn') {
    const paramList = items[1] && items[1].t === 'list' ? items[1].items : [];
    const { inputs, outputs } = parseFnParams(paramList);
    const bodyForms = items.slice(2);
    const primitive = isPrimitiveFn(bodyForms);
    return { t: 'fn', params: { inputs, outputs }, body: bodyForms, env, primitive };
  }

  if (name === 'lens') {
    if (items.length === 2 && items[1].t === 'quote') {
      return { t: 'lens', items: items[1].items };
    }
    const cellNodes = items.slice(1);
    // Capture original sym strings before resolution so tape subkind resolution
    // can match item names against cell indices at compile time.
    const origNames = cellNodes.map(it => (it.t === 'sym' ? it.s : null));
    const resolved = cellNodes.map(it => expandNode(it, env, ctx));
    return classifyLens(resolved, origNames);
  }

  if (name === 'tape') {
    // (tape '(...) :keep): keep the tape's live-evolved content across a same-layout
    // live re-send instead of rewriting it from the written seed. Strip the flag here
    // so the positional quote/subkind parse below is unaffected.
    const keep = items.some(it => it.t === 'kw' && it.s === 'keep');
    const targs = keep ? items.filter(it => !(it.t === 'kw' && it.s === 'keep')) : items;
    // (tape :len N): a blank tape of N cells. Length is stated directly in cells,
    // the tape's own unit -- no reverse-engineering from seconds and a clock rate.
    const lenIdx = targs.findIndex(it => it.t === 'kw' && it.s === 'len');
    if (lenIdx >= 0) {
      const nNode = expandNode(targs[lenIdx + 1], env, ctx);
      if (!nNode || nNode.t !== 'num') {
        throw new Error('tape :len must be a constant number of cells');
      }
      return { t: 'tape', items: [], blankLen: nNode.v };
    }
    let subkind = null;
    let quoteNode;
    if (targs.length === 2 && targs[1].t === 'quote') {
      quoteNode = targs[1];
    } else if (targs.length >= 3 && targs[2] && targs[2].t === 'quote') {
      const sub = targs[1];
      subkind = sub.t === 'sym' ? sub.s : sub.t === 'kw' ? sub.s : null;
      quoteNode = targs[2];
    } else {
      quoteNode = targs[targs.length - 1];
    }
    // Resolve a sym arg: (tape pat) where pat is bound to a quote node in the env.
    if (quoteNode && quoteNode.t === 'sym') {
      const r = envLookup(env, quoteNode.s);
      if (r.found && r.value && r.value.t === 'quote') quoteNode = r.value;
    }
    const forNotes = subkind === 'notes';
    const rawItems = quoteNode && quoteNode.t === 'quote'
      ? expandQuoteItems(quoteNode, forNotes, env)
      : [expandNode(quoteNode, env, ctx)];

    // When the subkind names a lens/op-lens binding in scope, the seed items are
    // its cell names: resolve each to its index in that binding, NOT through the
    // global env (so an item missing from the binding names the binding, not a
    // bare "unknown name"). Otherwise resolve sym cells (x, ., note names, etc.)
    // through the env so lowerTape receives only num nodes.
    const subBinding = (subkind && !forNotes) ? envLookup(env, subkind) : { found: false };
    let tapeItems;
    if (subBinding.found && (subBinding.value.t === 'lens' || subBinding.value.t === 'oplens')) {
      const cellNames = subBinding.value.names || null;
      if (!cellNames) {
        throw new Error(`tape: subkind "${subkind}" has no cell names; cannot resolve items`);
      }
      if (rawItems.length === 0) {
        throw new Error(`tape: subkind "${subkind}" seed must not be empty`);
      }
      tapeItems = rawItems.map(item => {
        if (item.t === 'num') return item; // numeric literal -> direct index
        const itemName = item.t === 'sym' ? item.s : null;
        if (itemName === null) {
          throw new Error(
            `tape: subkind "${subkind}" seed item must be a sym or number; got "${item.t}"`
          );
        }
        const idx = cellNames.indexOf(itemName);
        if (idx === -1) {
          throw new Error(
            `tape: item "${itemName}" not found in "${subkind}" (cells: ${cellNames.join(', ')})`
          );
        }
        return { t: 'num', v: idx };
      });
    } else if (subBinding.found) {
      throw new Error(
        `tape: subkind "${subkind}" must be a lens or op-lens; got "${subBinding.value.t}"`
      );
    } else {
      // No subkind binding (plain tape, or an intrinsic tag handled elsewhere):
      // resolve seed syms through the env; throw on any that does not resolve.
      tapeItems = rawItems.map(item => {
        if (item.t !== 'sym') return item;
        const r = envLookup(env, item.s);
        if (r.found) return r.value;
        throw new Error(`unknown name: ${item.s}`);
      });
    }

    const result = { t: 'tape', items: tapeItems };
    if (subkind) result.subkind = subkind;
    if (keep) result.keep = true;
    return result;
  }

  if (name === 'audio') {
    const rawArgs = items.slice(1).map(it => expandNode(it, env, ctx));
    const { kwargs } = splitArgs(rawArgs);
    const result = { t: 'audio' };
    if (kwargs.seconds !== undefined) result.seconds = kwargs.seconds;
    if (kwargs.length !== undefined) result.length = kwargs.length;
    return result;
  }

  if (name === 'score') {
    // (score '(NOTE _ ~ NOTE ...)) produces a dual-port object:
    //   :notes  = the pitch sequence; _ and ~ hold the previous note (a v/oct
    //             sequencer is a sample-and-hold, so a rest must not drop the
    //             pitch to 0 = C-1 and pitch-bend the voice's release tail down).
    //   :rhythm = a tape of 0/4095 gates (4095 for actual notes, 0 for _ and ~).
    const q = items[1];
    const rawItems = q && q.t === 'quote' ? expandQuoteItems(q, true, env) : [];
    const rhythm = rawItems.map(it => {
      if (it.t === 'sym' && (it.s === '_' || it.s === '~')) return { t: 'num', v: 0 };
      return { t: 'num', v: 4095 };
    });
    // Carry the last sounded pitch through rests/ties; leading rests hold 0.
    let held = { t: 'num', v: 0 };
    const noteItems = rawItems.map(it => {
      if (it.t === 'sym' && (it.s === '_' || it.s === '~')) return held;
      held = it;
      return it;
    });
    return {
      t: 'outputs',
      ports: [
        { name: 'notes', value: { t: 'tape', subkind: 'notes', items: noteItems } },
        { name: 'rhythm', value: { t: 'tape', subkind: 'rhythm', items: rhythm } },
      ],
    };
  }

  // (normal JACK DEFAULT): the jack when a cable is patched, else the default.
  // Sugar over the `connected` predicate.
  if (name === 'normal') {
    const jack = expandNode(items[1], env, ctx);
    const def_ = expandNode(items[2], env, ctx);
    return { t: 'call', op: 'if',
             args: [{ t: 'connected', jack }, jack, def_],
             kwargs: Object.create(null) };
  }

  // (connected JACK): VMAX if a cable is patched into JACK, else 0.
  if (name === 'connected') {
    return { t: 'connected', jack: expandNode(items[1], env, ctx) };
  }

  if (name === 'morph') {
    return { t: 'morph', args: items.slice(1).map(it => expandNode(it, env, ctx)) };
  }

  if (name === 'feedback') {
    return { t: 'feedback', args: items.slice(1).map(it => expandNode(it, env, ctx)) };
  }

  if (name === 'z1') {
    return { t: 'z1', x: expandNode(items[1], env, ctx) };
  }

  // hold -- a sample & hold. Two shapes, told apart by whether it carries a clock:
  //   (hold VAL ON) | (hold VAL :on ON)     level S&H (op_hold): track VAL while ON
  //   (hold NAME NEXT :trig C | :per-sample [:init V])   a register/fold: NAME reads
  //       the held value, NEXT is stored each clock edge (or sample). NEXT may use
  //       NAME for feedback (counters, accumulators).
  //   (hold VAL :trig C | :per-sample [:init V])         edge/per-sample S&H of VAL.
  // The register desugars to a one-cell tape read by lookup (no head dependency, so
  // the feedback is a clean one-sample z-1) plus a recordhead write.
  if (name === 'hold') {
    const raw = items.slice(1);
    const pos = [];
    const kw = Object.create(null);
    for (let i = 0; i < raw.length; i++) {
      const it = raw[i];
      if (it && it.t === 'kw') {
        if (it.s === 'per-sample') kw['per-sample'] = true;
        else { kw[it.s] = raw[i + 1]; i++; }
      } else pos.push(it);
    }
    const hasClock = kw.trig !== undefined || kw['per-sample'];
    if (!hasClock) {
      // Level sample & hold: track the value while the gate is high.
      const gate = pos.length >= 2 ? pos[1] : kw.on;
      if (!gate) throw new Error('hold: level S&H needs a gate, e.g. (hold v g) or (hold v :on g)');
      return { t: 'call', op: 'hold',
        args: [expandNode(pos[0], env, ctx), expandNode(gate, env, ctx)],
        kwargs: Object.create(null) };
    }
    const initNode = kw.init !== undefined ? expandNode(kw.init, env, ctx) : null;
    const initVal = initNode && initNode.t === 'num' ? initNode.v : 0;
    const cellNode = { t: 'tape', items: [{ t: 'num', v: initVal }] };
    const readNode = { t: 'call', op: 'lookup', args: [cellNode, { t: 'num', v: 0 }], kwargs: Object.create(null) };
    let valueNode;
    if (pos.length >= 2) {
      // (hold NAME NEXT ...): bind NAME to the held value, then expand NEXT.
      if (pos[0].t !== 'sym') throw new Error('hold: register form needs a name first, e.g. (hold count (add count 1) :trig clk)');
      const childEnv = makeEnv(env);
      envBind(childEnv, pos[0].s, readNode);
      valueNode = expandNode(pos[1], childEnv, ctx);
    } else {
      valueNode = expandNode(pos[0], env, ctx);   // sample an external value, no feedback
    }
    const cableKwargs = Object.create(null);
    if (kw.trig !== undefined) cableKwargs.trig = expandNode(kw.trig, env, ctx);
    else cableKwargs['per-sample'] = { t: 'flag' };
    ctx.localCables.push({ sink: cellNode, value: valueNode, kwargs: cableKwargs });
    return readNode;
  }

  if (name === 'outputs') {
    const ports = items.slice(1).map(it => {
      if (it.t === 'list' && it.items.length >= 2) {
        const portName = it.items[0].s || '?';
        const value = expandNode(it.items[1], env, ctx);
        return { name: portName, value };
      }
      return { name: '?', value: expandNode(it, env, ctx) };
    });
    return { t: 'outputs', ports };
  }

  // (len LIST): a static lens/oplens/quote folds to its cell count at compile time
  // (squint needs this to spread the selector across the list length).
  if (name === 'len' && items.length === 2) {
    const arg = expandNode(items[1], env, ctx);
    if (arg && arg.t === 'lens')   return { t: 'num', v: arg.items.length };
    if (arg && arg.t === 'oplens') return { t: 'num', v: arg.cells.length };
    if (arg && arg.t === 'quote')  return { t: 'num', v: arg.items.length };
    if (arg && arg.t === 'num')    return { t: 'num', v: 1 }; // scalar = length-1
    // Dynamic tape: fall through to the op_len primitive path.
  }

  // (thru LIST IDX): positional. LIST first, index second. Out-of-range wraps.
  // A value cell IS the value; an op-lens cell is selected here and applied via
  // ((thru ops IDX) X) (handled in the non-sym-head path above).
  if (name === 'thru') {
    const listNode = expandNode(items[1], env, ctx);

    };
    if (op in MIDI_CH_BASE) {
      const chNode = kwargs.ch;
      let ch = 0;
      if (chNode && chNode.t === 'num') {
        ch = chNode.v;
        if (ch < 1 || ch > 16) throw new Error(`(${op} :ch ${ch}): channel must be 1..16`);
      } else if (chNode) {
        throw new Error(`(${op} :ch): expected a number 1..16`);
      }
      return allocSlot('op_midi', [], { param0: MIDI_CH_BASE[op] + ch }, { state: [] });
    }
    if (op === 'midi-cc') {
      // CC number given as a flag label, e.g. (midi-cc :1) -> kwargs key "1" with t==='flag'.
      const ccKey = Object.keys(kwargs).find(k => kwargs[k].t === 'flag' && /^\d+$/.test(k));
      if (ccKey === undefined) {
        throw new Error('(midi-cc): missing CC number label, e.g. (midi-cc :1)');
      }
      const K = parseInt(ccKey, 10);
      if (K < 0 || K > 127) throw new Error(`(midi-cc :${ccKey}): CC number must be 0..127`);
      return allocSlot('op_midi', [], { param0: MIDI_CC_BASE + K }, { state: [] });
    }
    if (op === 'midi-trig') {
      const noteNode = kwargs.note;
      if (!noteNode || noteNode.t !== 'num') {
        throw new Error('(midi-trig :note N): :note is required and must be a number 0..127');
      }
      const note = noteNode.v;
      if (note < 0 || note > 127) throw new Error(`(midi-trig :note ${note}): note must be 0..127`);
      const leafRef = allocSlot('op_midi', [], { param0: MIDI_HELD_BASE + note }, { state: [] });
      const edgeRef = allocSlot('op_edge', [leafRef], { param0: 0 });
      return allocSlot('op_gate', [edgeRef], { param0: 0 });
    }
    // wavetable / wt: flash-resident wavetable oscillator.
    // in0=pitch (NOTE domain), in1=pos (0..VMAX), in2=pm, param0 = (table_idx<<2)|mode.
    if (op === 'wavetable' || op === 'wt') {
      const RATE_KWARGS = ['note', 'midi', 'pitch', 'hz', 'rate', 'cents'];
      let mode = 0;
      let rateRef = { kind: 'const', value: 69 };
      for (const kw of RATE_KWARGS) {
        if (kwargs[kw]) {
          if (kw === 'hz') { mode = 1; } else if (kw === 'rate' || kw === 'cents') { mode = 2; }
          rateRef = lowerNode(kwargs[kw]);
          break;
        }
      }
      if (args[0]) rateRef = lowerNode(args[0]);
      const posRef = kwargs.pos  ? lowerNode(kwargs.pos)  : { kind: 'const', value: 0 };
      const pmRef  = kwargs.pm   ? lowerNode(kwargs.pm)   : { kind: 'const', value: 0 };
      const tableNode = kwargs.table;
      const tableIdx = (tableNode && tableNode.t === 'num') ? (tableNode.v & 3) : 0;
      const param0 = (mode & 3) | (tableIdx << 2);
      return allocSlot('op_wavetable', [rateRef, posRef, pmRef], { param0 });
    }
    // detent: in[0] = x, in[1..] = snap points; param0 = point count.
    if (op === 'detent') {
      const ins = args.map(lowerNode);
      const npts = ins.length > 0 ? ins.length - 1 : 0;
      return allocSlot('op_detent', ins.slice(0, 5), { param0: npts }, { state: [] });
    }
    // snap: fold a static scale into a 12-bit pitch-class mask in param0.
    if (op === 'snap') {
      const noteRef = args[0] ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      const scaleNode = kwargs.scale !== undefined ? kwargs.scale : args[1];
      let mask = 0;
      if (scaleNode && scaleNode.t === 'num') {
        mask = scaleNode.v & 0xFFF;
      } else if (scaleNode && Array.isArray(scaleNode.items)) {
        for (const item of scaleNode.items) {
          if (item.t === 'num') mask |= 1 << (((item.v % 12) + 12) % 12);
        }
      }
      if (mask) return allocSlot('op_snap', [noteRef], { param0: mask }, { state: [] });
      // mask 0 (dynamic or empty scale): fall through to generic path.
    }
    // (mix a b c ...): equal-weight average by default; :levels '(w0 w1 ...) for a
    // custom weighting. Both normalise to the weight sum and expand to a sum of
    // vca'd inputs (no kernel), so N inputs mix at 1/N each and the output stays
    // bounded. Two inputs without :levels fall through to op_mix2 (a 50/50 average).
    if (op === 'mix') {
      const hasLevels = kwargs.levels &&
        (kwargs.levels.t === 'quote' || kwargs.levels.t === 'list');
      if (hasLevels || args.length > 2) {
        const inputs = args.map(lowerNode);
        let ws;
        if (hasLevels) {
          ws = kwargs.levels.items.map(it => (it.t === 'num' ? it.v : 0));
          if (ws.length !== inputs.length) {
            throw new Error(`(mix ... :levels): ${ws.length} levels for ${inputs.length} inputs`);
          }
        } else {
          ws = inputs.map(() => 1);   // equal weights
        }
        const sum = ws.reduce((a, b) => a + b, 0) || 1;
        const scaled = inputs.map((ref, i) =>
          allocSlot('op_vca', [ref, { kind: 'const', value: Math.round(ws[i] * 4095 / sum) }], {}, {}));
        if (scaled.length === 1) return scaled[0];
        return allocSlot('op_add', scaled, {}, {}); // post-pass folds >2 into an add2 tree
      }
    }
    // Variadic ops that chain into binary pairs.
    if (op === 'add' || op === 'mul' || op === 'or' || op === 'and') {
      const positionalInputs = args.map(lowerNode);
      if (positionalInputs.length > 2) {
        return lowerVariadic(op, positionalInputs, kwargs);
      }
    }

    // Table-driven general path: covers all OP_TABLE ops not already handled above.
    if (OP_TABLE[op]) {
      return lowerTableOp(op, OP_TABLE[op], args, kwargs);
    }

    const kernel = chooseKernel(op, kwargs);
    const ins = args.map(lowerNode);

    // range: one structural mode word in param0.
    if (op === 'range') {
      const xRef = args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      let param0 = 0;
      const tv = kwargs['to-value'], ti = kwargs['to-index'];
      if (tv && tv.t === 'num')      param0 = ((tv.v & 0x3FFFFFFF) | 0x40000000) >>> 0;
      else if (ti && ti.t === 'num') param0 = (ti.v & 0x3FFFFFFF) >>> 0;
      return allocSlot('op_range', [xRef], { param0 }, {});
    }

    // tap: C reads in0=buf, in1=amount, in2=cur_head, param0 bit0 = :span flag.
    // in2 is a placeholder filled by the post-pass with the paired recordhead head.
    if (op === 'tap') {
      const bufArg    = args[0] !== undefined ? args[0] : kwargs.tape;
      const bufRef    = bufArg !== undefined ? lowerNode(bufArg) : { kind: 'const', value: 0 };
      const amountArg = kwargs.amount !== undefined ? kwargs.amount : args[1];
      const amountRef = amountArg !== undefined ? lowerNode(amountArg) : { kind: 'const', value: 0 };
      const spanFlag  = (kwargs.span && kwargs.span.t === 'flag') ? 1 : 0;
      return allocSlot('op_tap', [bufRef, amountRef, { kind: 'const', value: 0 }], { param0: spanFlag }, {});
    }

    // pluck: Karplus-Strong plucked string. in0=trig, in1=pitch (MIDI), in2=damp,
    // in3=private audio delay line. The buffer must cover the longest period
    // (lowest pitch): 1536 cells ~ MIDI 24 (~32 Hz) at 48 kHz.
    if (op === 'pluck') {
      const trigArg  = args[0] !== undefined ? args[0] : kwargs.trig;
      const pitchArg = args[1] !== undefined ? args[1] : kwargs.pitch;
      const dampArg  = args[2] !== undefined ? args[2] : kwargs.damp;
      const trigRef  = trigArg  !== undefined ? lowerNode(trigArg)  : { kind: 'const', value: 0 };
      const pitchRef = pitchArg !== undefined ? lowerNode(pitchArg) : { kind: 'const', value: 60 };
      const dampRef  = dampArg  !== undefined ? lowerNode(dampArg)  : { kind: 'const', value: 2048 };
      const bufRef   = allocBuffer('audio', 1536);
      return allocSlot('op_pluck', [trigRef, pitchRef, dampRef, bufRef], { param0: 0 }, {});
    }

    if (op === 'reverb') {
      const inArg = args[0] !== undefined ? args[0] : kwargs.in;
      const decayArg = args[1] !== undefined ? args[1] : kwargs.decay;
      const mixArg = args[2] !== undefined ? args[2] : kwargs.mix;
      const inRef = inArg !== undefined ? lowerNode(inArg) : { kind: 'const', value: 0 };
      const decayRef = decayArg !== undefined ? lowerNode(decayArg) : { kind: 'const', value: 2048 };
      const mixRef = mixArg !== undefined ? lowerNode(mixArg) : { kind: 'const', value: 1024 };
      const bufRef = allocBuffer('audio', 5952);
      return allocSlot('op_reverb', [inRef, decayRef, mixRef, bufRef], { param0: 0 }, {});
    }

    if (op === 'chorus') {
      const inArg = args[0] !== undefined ? args[0] : kwargs.in;
      const rateArg = args[1] !== undefined ? args[1] : kwargs.rate;
      const depthArg = args[2] !== undefined ? args[2] : kwargs.depth;
      const fbArg = args[3] !== undefined ? args[3] : kwargs.feedback;
      const inRef = inArg !== undefined ? lowerNode(inArg) : { kind: 'const', value: 0 };
      const rateRef = rateArg !== undefined ? lowerNode(rateArg) : { kind: 'const', value: 100 };
      const depthRef = depthArg !== undefined ? lowerNode(depthArg) : { kind: 'const', value: 1024 };
      const fbRef = fbArg !== undefined ? lowerNode(fbArg) : { kind: 'const', value: 1024 };
      const bufRef = allocBuffer('audio', 1024);
      return allocSlot('op_chorus', [inRef, rateRef, depthRef, fbRef, bufRef], { param0: 0 }, {});
    }

    if (op === 'flanger') {
      const inArg = args[0] !== undefined ? args[0] : kwargs.in;
      const rateArg = args[1] !== undefined ? args[1] : kwargs.rate;
      const depthArg = args[2] !== undefined ? args[2] : kwargs.depth;
      const fbArg = args[3] !== undefined ? args[3] : kwargs.feedback;
      const inRef = inArg !== undefined ? lowerNode(inArg) : { kind: 'const', value: 0 };
      const rateRef = rateArg !== undefined ? lowerNode(rateArg) : { kind: 'const', value: 50 };
      const depthRef = depthArg !== undefined ? lowerNode(depthArg) : { kind: 'const', value: 512 };
      const fbRef = fbArg !== undefined ? lowerNode(fbArg) : { kind: 'const', value: 2048 };
      const bufRef = allocBuffer('audio', 512);
      return allocSlot('op_flanger', [inRef, rateRef, depthRef, fbRef, bufRef], { param0: 0 }, {});
    }

    if (op === 'compressor') {
      const inArg = args[0] !== undefined ? args[0] : kwargs.in;
      const threshArg = args[1] !== undefined ? args[1] : kwargs.threshold;
      const ratioArg = args[2] !== undefined ? args[2] : kwargs.ratio;
      const attArg = args[3] !== undefined ? args[3] : kwargs.attack;
      const relArg = args[4] !== undefined ? args[4] : kwargs.release;
      const inRef = inArg !== undefined ? lowerNode(inArg) : { kind: 'const', value: 0 };
      const threshRef = threshArg !== undefined ? lowerNode(threshArg) : { kind: 'const', value: 3000 };
      const ratioRef = ratioArg !== undefined ? lowerNode(ratioArg) : { kind: 'const', value: 2048 };
      const attRef = attArg !== undefined ? lowerNode(attArg) : { kind: 'const', value: 100 };
      const relRef = relArg !== undefined ? lowerNode(relArg) : { kind: 'const', value: 1000 };
      return allocSlot('op_compressor', [inRef, threshRef, ratioRef, attRef, relRef], { param0: 0 }, {});
    }

    if (op === 'sel') {
      const targetRef = lowerNode(args[0]);
      if (targetRef && targetRef.kind === 'slot') {
        return { kind: 'slot', id: targetRef.id, read: 'out2' };
      }
      return targetRef;
    }

    // dx: fused DX7 voice from a flash bank or custom voice buffer. param0 = bank index;
    // in0=decay, in1=pitch, in2=gate, in3=preset/voice, in4=tone.
    if (op === 'dx') {
      const bankArg   = kwargs.bank   !== undefined ? kwargs.bank   : undefined;
      const presetArg = kwargs.preset !== undefined ? kwargs.preset : undefined;
      const voiceArg  = kwargs.voice  !== undefined ? kwargs.voice  : undefined;
      const pitchArg  = kwargs.pitch  !== undefined ? kwargs.pitch  : undefined;
      const gateArg   = kwargs.gate   !== undefined ? kwargs.gate   : undefined;
      const decayArg  = kwargs.decay  !== undefined ? kwargs.decay  : undefined;
      const toneArg   = kwargs.tone   !== undefined ? kwargs.tone   : undefined;
      const z = { kind: 'const', value: 0 };
      const pitchRef  = pitchArg  !== undefined ? lowerNode(pitchArg)  : { kind: 'const', value: 69 };
      const gateRef   = gateArg   !== undefined ? lowerNode(gateArg)   : z;
      const decayRef  = decayArg  !== undefined ? lowerNode(decayArg)  : { kind: 'const', value: 2048 };
      const toneRef   = toneArg   !== undefined ? lowerNode(toneArg)   : { kind: 'const', value: 2048 };

      if (voiceArg !== undefined) {
        const voiceRef = lowerNode(voiceArg);
        return allocSlot('op_dx', [decayRef, pitchRef, gateRef, voiceRef, toneRef], { param0: 0x8000 }, {});
      }
      const presetRef = presetArg !== undefined ? lowerNode(presetArg) : z;
      const bankIdx   = (bankArg && bankArg.t === 'num') ? bankArg.v : 0;
      return allocSlot('op_dx', [decayRef, pitchRef, gateRef, presetRef, toneRef], { param0: bankIdx }, {});
    }

    // wave (wavetable / grain reader): composites a phasor + op_wave from pitch kwargs.
    if (op === 'wave' && !('slots' in kwargs)) {
      const bufRef = args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 };
      const PITCH = { midi: 0, note: 0, hz: 1, rate: 2 };
      const pk = ['midi', 'note', 'hz', 'rate'].find(k => k in kwargs);
      let scanRef;
      if (pk) {
        const mode = PITCH[pk] & 3;
        const rateRef = lowerNode(kwargs[pk]);
        const onceRef = kwargs.once ? lowerNode(kwargs.once) : null;
        const base = mode | (onceRef ? 4 : 0);
        const pins = onceRef ? [rateRef, onceRef] : [rateRef];
        let phaseRef = allocSlot('op_phasor', pins, { param0: base }, {}); // :phase ramp
        if (kwargs.len) phaseRef = allocSlot('op_vca', [phaseRef, lowerNode(kwargs.len)], {}, {});
        if (kwargs.pos) phaseRef = allocSlot('op_add', [phaseRef, lowerNode(kwargs.pos)], {}, {});
        scanRef = phaseRef;
      } else {
        scanRef = kwargs.pos ? lowerNode(kwargs.pos) : { kind: 'const', value: 0 };
      }
      return allocSlot('op_wave', [bufRef, scanRef], {}, {});
    }

    // thru (data-lens decode): C reads in0=lens buffer, index from in1 (always).
    if (op === 'thru') {
      const lensRef = kwargs.lens ? lowerNode(kwargs.lens)
                    : (args[0] !== undefined ? lowerNode(args[0]) : { kind: 'const', value: 0 });
      const atArg = kwargs.at !== undefined ? kwargs.at : args[1];
      const atRef = (atArg !== undefined && atArg.t === 'num')
                  ? { kind: 'const', value: atArg.v & 0xFFF }
                  : (atArg !== undefined ? lowerNode(atArg) : { kind: 'const', value: 0 });
      return allocSlot('op_thru', [lensRef, atRef], {}, {});
    }

    // Oscillators + clock: detect rate kwargs and bake mode bits into param0 low 2 bits.
    // Rate modes: 0=NOTE, 1=HZ, 2=RATE, 3=TEMPO.  in0 carries the rate value.
    const OSC_OPS = new Set(['phasor', 'sine', 'triangle', 'saw', 'square']);
    if (OSC_OPS.has(op)) {
      /* :midi is the same as :note for rate-mode purposes (both NOTE-domain). */
      const RATE_KWARGS = ['note', 'midi', 'hz', 'rate', 'tempo', 'bpm'];
      const found = RATE_KWARGS.filter(k => k in kwargs);
      if (found.length > 1) throw new Error(`ambiguous rate kwargs: ${found.join(', ')}`);

      let mode = 0;      // default NOTE
      const oscPositional = args.map(lowerNode);
      let rateRef = (oscPositional.length >= 1)
        ? oscPositional[0]
        : { kind: 'const', value: 69 };

      if (found.length === 1) {
        const kw = found[0];
        const val = kwargs[kw];
        if (kw === 'note' || kw === 'midi') {
          mode = 0;
          rateRef = lowerNode(val);
        } else if (kw === 'hz') {
          if (val.t === 'num' && !(Number.isInteger(val.v) && val.v >= 1)) {
            mode = 2;
            rateRef = { kind: 'const', value: hzToRateCode(val.v) };
          } else {
            mode = 1;
            rateRef = lowerNode(val);
          }
        } else if (kw === 'rate') {
          mode = 2;
          rateRef = lowerNode(val);
        } else if (kw === 'tempo') {
          mode = 3;
          rateRef = lowerNode(val);
        } else if (kw === 'bpm') {
          if (val.t === 'num') {
            const hz = val.v / 60;
            if (Number.isInteger(hz) && hz >= 1) {
              mode = 1;
              rateRef = { kind: 'const', value: hz };
            } else {
              mode = 2;
              rateRef = { kind: 'const', value: hzToRateCode(hz) };
            }
          } else {
            mode = 1;
            const bpmRef = lowerNode(val);
            const sixtyRef = { kind: 'const', value: 60 };
            rateRef = allocSlot('op_div', [bpmRef, sixtyRef], {}, {});
          }
        }
      }

      // :phase drives the shaper from an external phase (e.g. a phasor ramp) instead of
      // the internal accumulator (param0 bit 4). The rate/pitch is then ignored.
      const phaseRef = kwargs.phase ? lowerNode(kwargs.phase) : null;

      if (op === 'sine') {
        // sine: param0 encodes mode (bits 1..0), PM present (bit 2), depth present (bit 3),
        // phase-driven (bit 4), self-feedback present (bit 5).
        // Inputs: in0 = phase/rate, in1 = pm, in2 = depth, in3 = fb. Optional inputs that
        // precede a present one are padded with a const 0 to keep slot order.
        const pmRef    = kwargs.pm    ? lowerNode(kwargs.pm)    : null;
        const depthRef = kwargs.depth ? lowerNode(kwargs.depth) : null;
        const fbRef    = kwargs.fb    ? lowerNode(kwargs.fb)    : null;
        let param0 = mode & 3;
        if (phaseRef) param0 |= 16;
        if (pmRef)    param0 |= 4;
        if (depthRef) param0 |= 8;
        if (fbRef)    param0 |= 32;
        const z = { kind: 'const', value: 0 };
        const sineIns = [phaseRef || rateRef];
        if (pmRef || depthRef || fbRef) sineIns.push(pmRef || z);     // in1
        if (depthRef || fbRef)          sineIns.push(depthRef || z);  // in2
        if (fbRef)                      sineIns.push(fbRef);          // in3
        return allocSlot(kernel, sineIns.slice(0, 5), { param0 }, {});
      }

      // phasor outputs its ramp (the phase). :sync locks to an external pulse.
      if (op === 'phasor') {
        const syncRef = kwargs.sync ? lowerNode(kwargs.sync) : null;
        const lock = syncRef && found.length === 0 && args.length === 0;
        const base = (mode & 3) | (syncRef ? 4 : 0) | (lock ? 8 : 0);
        const pIns = syncRef ? [rateRef, syncRef] : [rateRef];
        return allocSlot('op_phasor', pIns, { param0: base }, {});
      }

      // triangle/saw/square: param0 low 2 bits = mode; in0 = rate value. With :phase,
      // in0 is an external phase (bit 4 set) and the rate is ignored.
      return allocSlot(kernel, [phaseRef || rateRef], { param0: phaseRef ? 16 : (mode & 3) }, {});
    }

    // wavetable / wt: flash-resident wavetable oscillator.
    // in0=pitch/hz/rate, in1=pos (0..4095), in2=pm. param0 = mode|(table_idx<<2).
    if (op === 'wavetable' || op === 'wt') {
      const RATE_KWARGS = ['note', 'midi', 'pitch', 'hz', 'rate', 'cents'];
      let mode = 0;
      let rateRef = { kind: 'const', value: 69 };
      for (const kw of RATE_KWARGS) {
        if (kwargs[kw] !== undefined) {
          if (kw === 'hz') { mode = 1; }
          else if (kw === 'rate' || kw === 'cents') { mode = 2; }
          rateRef = lowerNode(kwargs[kw]);
          break;
        }
      }
      if (args[0] !== undefined) rateRef = lowerNode(args[0]);
      const posRef = kwargs.pos !== undefined ? lowerNode(kwargs.pos) : { kind: 'const', value: 0 };
      const pmRef  = kwargs.pm  !== undefined ? lowerNode(kwargs.pm)  : { kind: 'const', value: 0 };
      const tableNode = kwargs.table;
      const tableIdx = (tableNode && tableNode.t === 'num') ? (tableNode.v & 3) : 0;
      const param0 = (mode & 3) | (tableIdx << 2);
      return allocSlot('op_wavetable', [rateRef, posRef, pmRef], { param0 }, {});
    }

    // Generic fallback for ops not in OP_TABLE and not handled above.
    // Numeric kwargs fold into param0 (sorted by key); dynamic kwargs become extra inputs.
    const params = {};
    const extraIns = [];

    for (const [k, v] of Object.entries(kwargs)) {
      if (k === 'port') continue;
      if (v.t === 'flag') {
        // Flags go into meta.
      } else if (v.t === 'num') {
        params[k] = v.v;
      } else {
        extraIns.push({ key: k, ref: lowerNode(v) });
      }
    }

    // trig inputs lead so clock-consumers find their clock first.
    const orderedExtras = [
      ...extraIns.filter(e => e.key === 'trig'),
      ...extraIns.filter(e => e.key !== 'trig'),
    ];

    const allIns = [
      ...ins,
      ...orderedExtras.map(e => e.ref),
    ].slice(0, 5);

    const flags = Object.entries(kwargs)
      .filter(([, v]) => v.t === 'flag')
      .map(([k]) => k);

    const meta = {};
    if (flags.length) meta.flags = flags;

    return allocSlot(kernel, allIns, params, meta);
  }

  function lowerVariadic(op, inputRefs, kwargs) {
    // Chain into binary pairs left-to-right.
    // (mix a b c d) -> mix2(mix2(a,b), mix2(c,d))
    const kernel = opToKernel(op) + '2';
    let refs = inputRefs;
    while (refs.length > 2) {
      const next = [];
      for (let i = 0; i < refs.length; i += 2) {
        if (i + 1 < refs.length) {
          const pairParams = {};
          for (const [k, v] of Object.entries(kwargs)) {
            if (v.t === 'num') pairParams[k] = v.v;
          }
          const flags = Object.entries(kwargs).filter(([, v]) => v.t === 'flag').map(([k]) => k);
          const meta = flags.length ? { flags } : {};
          next.push(allocSlot(kernel, [refs[i], refs[i + 1]], pairParams, meta));
        } else {
          next.push(refs[i]); // odd one out passes through
        }
      }
      refs = next;
    }
    // Final pair.
    const pairParams = {};
    for (const [k, v] of Object.entries(kwargs)) {
      if (v.t === 'num') pairParams[k] = v.v;
    }
    const flags = Object.entries(kwargs).filter(([, v]) => v.t === 'flag').map(([k]) => k);
    const meta = flags.length ? { flags } : {};
    return allocSlot(kernel, refs.slice(0, 2), pairParams, meta);
  }

  function lowerLens(node) {
    if (bufMemo.has(node)) return bufMemo.get(node);
    const seed = node.items.map(item => {
      if (item.t === 'num') return item.v;
      return 0;
    });
    const ref = allocBuffer('lens', seed.length, seed);
    bufMemo.set(node, ref);
    return ref;
  }

  // Lower a {t:'opthru', results:[node0..nodeK-1], at:atNode, clamp:bool}.
  function lowerOpThru(node) {
    const { results, at } = node;
    const K = results.length;
    const cellRefs = results.map(r => lowerNode(r));
    const rawAtRef = lowerNode(at);

    if (K === 0) return { kind: 'const', value: 0 };
    if (K === 1) return cellRefs[0];

    let atRef;
    if (node.clamp) {
      atRef = rawAtRef;
    } else {
      // Floored modulo: ((rawAt % K) + K) % K
      const kRef  = { kind: 'const', value: K };
      const mod1  = allocSlot('op_mod', [rawAtRef, kRef], {}, { state: [] });
      const addK  = allocSlot('op_add', [mod1, kRef], {}, { state: [] });
      atRef       = allocSlot('op_mod', [addK, kRef], {}, { state: [] });
    }

    function pick(refs, lo, hi) {
      if (hi - lo === 1) return refs[lo];
      const mid = (lo + hi) >> 1;
      const midRef = { kind: 'const', value: mid };

  WRITE_STATE:     0x02,
  SAVE_STATE:      0x03,

  PING:            0x05,
  READ_PERF:       0x06,
  DIAG:            0x07,
  SLOT_PERF:       0x08,
  SWAP_MODE:       0x09,
  UPDATE_CONST:    0x0A,
  STATE_DUMP:      0x10,
  PERF_DUMP:       0x11,
  DIAG_DUMP:       0x12,
  SLOT_PERF_DUMP:  0x13,
  ACK:             0x7F,
  NACK:            0x7E,

// 8-into-7: groups of up to 7 bytes -> 1 MSB byte + 7 low-bit bytes.
function pack78(raw) {
  const out = [];
  for (let i = 0; i < raw.length; i += 7) {
    const group = raw.slice(i, i + 7);
    let msb = 0;
    for (let k = 0; k < group.length; k++) if (group[k] & 0x80) msb |= (1 << k);
    out.push(msb);
    for (let k = 0; k < group.length; k++) out.push(group[k] & 0x7F);
  }
  return Uint8Array.from(out);
}

function unpack78(p) {
  const out = [];
  let i = 0;

      if (msb & (1 << k)) b |= 0x80;
      out.push(b);
    }
    i += group;
  }
  return Uint8Array.from(out);
}

// 2. STATE & POSITION VARIABLES
// ═══════════════════════════════════════════════════════════════════════

const state = {
  rows: [[], []], // rows[rowIdx] = [{ id, type, left: px, params: {} }]
  cables: [],     // { fromId, fromPort, toId, toPort, color }
  nextId: 1,
};

let lastActiveRow = 0; // tracks which row the user last interacted with

let lastUploadedSnapshot = null;

function getConstantsMetadata(bytes) {
  const r = {
    _b: bytes,
    _p: 0,
    u8() { return this._b[this._p++]; },
    u16() { const v = this._b[this._p] | (this._b[this._p+1]<<8); this._p+=2; return v; },
    u32() { const v = (this._b[this._p]|(this._b[this._p+1]<<8)|(this._b[this._p+2]<<16)|((this._b[this._p+3]<<24)>>>0)); this._p+=4; return v>>>0; },
    i32() { return this.u32() | 0; },
    str(n) { const s = String.fromCharCode(...this._b.slice(this._p, this._p+n)); this._p+=n; return s; },
    pos() { return this._p; }
  };

  // Header (19 bytes)
  const magic = [r.u8(), r.u8(), r.u8(), r.u8(), r.u8()];
  const version = r.u16();
  r.u16(); // flags
  const slot_count = r.u16();
  r.u16(); // reserved
  r.u16(); // reserved
  const buffer_count = r.u8();
  const terminal_count = r.u8();
  const kernel_id_count = r.u8();
  r.u8(); // reserved

  // Kernel Registry
  for (let i = 0; i < kernel_id_count; i++) {
    const len = r.u8();
    r.str(len);
  }

  const constants = [];
  let constIdx = 0;

  // Slot Table
  for (let i = 0; i < slot_count; i++) {
    const kid = r.u8();
    const core = r.u8();
    const in_count = r.u8();
    for (let j = 0; j < in_count; j++) {
      const tag = r.u8();
      if (tag === 0 || tag === 4) { // TAG_SLOT = 0, TAG_SLOT_OUT2 = 4
        r.u16();
      } else if (tag === 1) { // TAG_BUFFER = 1
        r.u16();
      } else if (tag === 2) { // TAG_CONST_U8 = 2
        const valOffset = r.pos();
        const val = r.u8();
        constants.push({
          const_idx: constIdx++,
          tag: tag,
          byte_offset: valOffset,
          value: val,
          size: 1
        });
      } else if (tag === 3) { // TAG_CONST_I32 = 3
        const valOffset = r.pos();
        const val = r.i32();
        constants.push({
          const_idx: constIdx++,
          tag: tag,
          byte_offset: valOffset,
          value: val,
          size: 4
        });
      }
    }
    r.u16(); // out_offset
    r.u32(); // param0
  }
  return constants;
}

function getConstantValueForKnob(m, paramName, rawVal) {
  const prevVal = m.params[paramName];
  m.params[paramName] = rawVal;

  let result;
  if (m.type === 'sine' || m.type === 'triangle' || m.type === 'saw' || m.type === 'square' || m.type === 'sub-osc') {
    if (paramName === 'pitch' || paramName === 'cents') {
      const pitchKnob = getKnobValue(m.type, 'pitch', m.params.pitch ?? 1935);
      const centsVal  = (getKnobValue(m.type, 'cents', m.params.cents ?? 2048) - 2048) / 204.8;
      const noteCable = state.cables.find(c => c.toId === m.id && c.toPort === 'note');
      if (noteCable) {
        result = Math.round(pitchKnob - 60 + centsVal);
      } else {
        result = Math.round(pitchKnob + centsVal);
      }
    }
  }

  if (result === undefined) {
    result = getKnobValue(m.type, paramName, rawVal);
  }

  m.params[paramName] = prevVal;
  return result;
}

function rebuildKnobConstantMap() {
  knobConstantMap = {};
  if (!compiledSnapshot) return;

  const allMods = state.rows.flat();
  const baseSnapshot = new Uint8Array(compiledSnapshot);
  let baseConsts;
  try {
    baseConsts = getConstantsMetadata(baseSnapshot);
  } catch (e) {
    console.warn('Failed to parse base constants:', e);
    return;
  }

  for (const m of allMods) {
    const def = MODULE_DEFS[m.type];
    if (!def || def.isHW) continue;
    for (const k of (def.knobs || [])) {
      const paramName = k.param;
      const originalVal = m.params[paramName] ?? k.def;
      
      const tempVal = originalVal >= 2048 ? originalVal - 1000 : originalVal + 1000;
      m.params[paramName] = tempVal;

      try {
        const code = generateCode(true); // textOnly = true
        const ast = Lens.read(code);
        const expanded = Lens.expand(ast, { loadFile: __webLoadFile });
        const lowered = Lens.lower(expanded);
        const sched = Lens.schedule(lowered);
        const tempSnapshot = Lens.encode(sched, lowered);

        if (tempSnapshot.length === baseSnapshot.length) {
          const tempConsts = getConstantsMetadata(tempSnapshot);
          if (tempConsts.length === baseConsts.length) {
            const diffs = [];
            for (let i = 0; i < baseConsts.length; i++) {
              if (baseConsts[i].value !== tempConsts[i].value) {
                diffs.push({ baseEntry: baseConsts[i], tempEntry: tempConsts[i] });
              }
            }
            if (diffs.length === 1) {
              knobConstantMap[`${m.id}.${paramName}`] = {
                const_idx: diffs[0].baseEntry.const_idx,
                byte_offset: diffs[0].baseEntry.byte_offset,
                size: diffs[0].baseEntry.size
              };
            }
          }
        }
      } catch (err) {
        console.warn(`[Knob Map] Error mapping ${m.id}.${paramName}:`, err);
      } finally {
        m.params[paramName] = originalVal;
      }
    }
  }
  console.log('[Knob Map] Rebuilt knobConstantMap:', knobConstantMap);
}

function triggerLiveUpdate() {
  if (!midiOut || !compiledSnapshot) return;
  if (isSendingLive) {
    liveUpdatePending = true;
    return;
  }
  if (liveUpdateTimer) clearTimeout(liveUpdateTimer);
  liveUpdateTimer = setTimeout(async () => {
    isSendingLive = true;
    liveUpdatePending = false;

    let didUpdateConst = false;
    if (lastUploadedSnapshot && lastUploadedSnapshot.length === compiledSnapshot.length) {
      try {
        const oldConsts = getConstantsMetadata(lastUploadedSnapshot);
        const newConsts = getConstantsMetadata(compiledSnapshot);
        if (oldConsts.length === newConsts.length) {
          const diffs = [];
          for (let i = 0; i < oldConsts.length; i++) {
            if (oldConsts[i].value !== newConsts[i].value) {
              diffs.push({ oldEntry: oldConsts[i], newEntry: newConsts[i] });
            }
          }
          let allBytesMatch = true;
          for (let i = 0; i < compiledSnapshot.length; i++) {
            if (lastUploadedSnapshot[i] !== compiledSnapshot[i]) {
              allBytesMatch = false;
              break;
            }
          }

          if (allBytesMatch) {
            didUpdateConst = true;
            const statusEl = $('status');
            statusEl.textContent = `${nodesCount} nodes · ${compiledSnapshot.length} B · live updated!`;
            statusEl.className = 'ok';
          } else if (diffs.length === 1) {
            const targetOffset = diffs[0].newEntry.byte_offset;
            const targetSize = diffs[0].newEntry.size;
            let otherBytesMatch = true;
            for (let i = 0; i < compiledSnapshot.length - 4; i++) {
              if (i >= targetOffset && i < targetOffset + targetSize) continue;
              if (lastUploadedSnapshot[i] !== compiledSnapshot[i]) {
                otherBytesMatch = false;
                break;
              }
            }
            if (otherBytesMatch && targetSize === 4) {
              const constIdx = diffs[0].newEntry.const_idx;
              const newValue = diffs[0].newEntry.value;
              const newCrc32 = compiledSnapshot[compiledSnapshot.length - 4] |
                               (compiledSnapshot[compiledSnapshot.length - 3] << 8) |
                               (compiledSnapshot[compiledSnapshot.length - 2] << 16) |
                               ((compiledSnapshot[compiledSnapshot.length - 1] << 24) >>> 0);

              const payload = new Uint8Array(11);
              payload[0] = constIdx;
              payload[1] = newValue & 0xFF;
              payload[2] = (newValue >> 8) & 0xFF;
              payload[3] = (newValue >> 16) & 0xFF;
              payload[4] = (newValue >> 24) & 0xFF;
              payload[5] = targetOffset & 0xFF;
              payload[6] = (targetOffset >> 8) & 0xFF;
              payload[7] = newCrc32 & 0xFF;
              payload[8] = (newCrc32 >> 8) & 0xFF;
              payload[9] = (newCrc32 >> 16) & 0xFF;
              payload[10] = (newCrc32 >> 24) & 0xFF;

              midiOut.send([...Lens.frame(Lens.CMD.UPDATE_CONST, payload)]);
              const m = await recvAck();
              if (m.cmd === Lens.CMD.ACK) {
                lastUploadedSnapshot = new Uint8Array(compiledSnapshot);
                didUpdateConst = true;
                const statusEl = $('status');
                statusEl.textContent = `${nodesCount} nodes · ${compiledSnapshot.length} B · live updated!`;
                statusEl.className = 'ok';
              }
            }
          }
        }
      } catch (e) {
        console.warn('Real-time constant update detection/execution failed, falling back to full upload:', e);
      }
    }

    if (!didUpdateConst) {
      try {
        await writeSnapshot();
        lastUploadedSnapshot = new Uint8Array(compiledSnapshot);
        const statusEl = $('status');
        statusEl.textContent = `${nodesCount} nodes · ${compiledSnapshot.length} B · playing live!`;
        statusEl.className = 'ok';
      } catch (e) {
        console.warn('Live update failed:', e.message);
      }
    }
    isSendingLive = false;
    if (liveUpdatePending) {
      triggerLiveUpdate();
    }
  }, 100);
}
let midiOut = null, midiIn = null, ackWaiter = null;
let compiledSnapshot = null;
let currentContextMenu = null;

let knobConstantMap = {};

const $  = id => document.getElementById(id);
const el = (tag, cls, attrs) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (attrs) Object.assign(e, attrs);
  return e;
};

function valToAngle(v) { return -135 + (Math.max(0, Math.min(4095, v)) / 4095) * 270; }

function getModuleData(id) {
  for (const row of state.rows) {
    const m = row.find(m => m.id === id);
    if (m) return m;
  }
  return null;
}
function getModuleRowIndex(id) {
  return state.rows.findIndex(row => row.some(m => m.id === id));
}

function snapToHP(val) {
  return Math.round(val / HP) * HP;
}

function findFreePosition(rowIndex, hpWidth) {
  const widthPx = hpWidth * HP;
  const rowMods = state.rows[rowIndex] || [];
  let candidate = 0;
  while (true) {
    let clash = false;
    for (const m of rowMods) {
      const def = MODULE_DEFS[m.type];
      const mWidth = (def ? def.hp : 6) * HP;
      const left = m.left || 0;
      if (candidate < left + mWidth && candidate + widthPx > left) {
        clash = true;
        candidate = snapToHP(left + mWidth + 15);
        break;
      }
    }
    if (!clash) return candidate;
  }
}

// Convert semitones/MIDI notes to clean readable text (e.g. C4, A#3)
function formatNote(val) {
  const noteNum = Math.round(val);
  const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  let idx = noteNum % 12;
  if (idx < 0) idx += 12;
  const octave = Math.floor(noteNum / 12) - 1;
  const noteName = names[idx];
  return `${noteName}${octave} (${noteNum})`;
}

// Helper to get formatted or snap value of a parameter
function scaleNote(rawVal) {
  return Math.round((rawVal / 4095) * 127);
}

function scaleBpm(rawVal) {
  return Math.round(40 + (rawVal / 4095) * 200);
}

function getKnobValue(type, paramName, rawVal) {
  if (rawVal === undefined || rawVal === null || Number.isNaN(rawVal)) {
    return undefined;
  }
  const def = MODULE_DEFS[type];
  if (!def) return rawVal;
  const kDef = def.knobs.find(k => k.param === paramName);
  if (kDef && kDef.discrete) {
    const idx = Math.max(0, Math.min(kDef.discrete.length - 1, Math.floor((rawVal / 4096) * kDef.discrete.length)));
    return kDef.discrete[idx];
  }
  if (paramName === 'pitch' || paramName === 'note') {
    return scaleNote(rawVal);
  }
  if (paramName === 'bpm') {
    return scaleBpm(rawVal);
  }
  return rawVal;
}

const DX7_PRESETS = {
  0: ["SOLID BASS", "S.BAS 27.7", "LeaderTape", "ANALOG  4", "ANALOG  6", "GASHAUS", "WINTRHODES", "*Mark III", "SYNDM 25.8", "JX-33-P", "Etherial5a", "ICE PAD  2", "M1 PADS", "Bounce 4", "CARLOS   2", "'Airy'", "SOFT TOUCH", "CIRRUS", "ENTRIX", "BORON A", "Textures 6", "Mooger Low", "*Hammond 1", "Mooger Low", "Mooger Low", "Mooger Low", "Mooger Low", "Mooger Low", "Mooger Low", "Mooger Low", "Mooger Low", "Mooger Low"],
  1: ["PICCOLO", "FLUTE   2", "OBOE", "CLARINET", "SAX BC", "BASSOON", "STRINGS 4", "STRINGS 5", "STRINGS 6", "STRINGS 7", "STRINGS 8", "BRASS   4", "BRASS   5", "BRASS 6 BC", "BRASS   7", "BRASS   8", "RECORDER", "HARMONICA1", "HRMNCA2 BC", "VOICE   2", "VOICE   3", "GLOKENSPL", "VIBE    2", "XYLOPHONE", "CHIMES", "GONG    1", "GONG    2", "BELLS", "COW BELL", "BLOCK", "FLEXATONE", "LOG DRUM"],
  2: ["BRASS   1", "BRASS   2", "BRASS   3", "STRINGS 1", "STRINGS 2", "STRINGS 3", "ORCHESTRA", "PIANO   1", "PIANO   2", "PIANO   3", "E.PIANO 1", "GUITAR  1", "GUITAR  2", "SYN-LEAD 1", "BASS    1", "BASS    2", "E.ORGAN 1", "PIPES   1", "HARPSICH 1", "CLAV    1", "VIBE    1", "MARIMBA", "KOTO", "FLUTE   1", "ORCH-CHIME", "TUB BELLS", "STEEL DRUM", "TIMPANI", "REFS WHISL", "VOICE   1", "TRAIN", "TAKE OFF"]
};

function getDisplayValueStr(type, paramName, rawVal, instanceId) {
  const def = MODULE_DEFS[type];
  if (!def) return '';
  const kDef = def.knobs.find(k => k.param === paramName);
  if (!kDef) return '';

  if (type === 'dx' && paramName === 'preset') {
    let bankIdx = 0;
    if (instanceId) {
      const mData = getModuleData(instanceId);
      if (mData) {
        const bankRaw = mData.params.bank ?? 0;
        bankIdx = Math.max(0, Math.min(2, Math.floor((bankRaw / 4096) * 3)));
      }
    }
    const voiceList = DX7_PRESETS[bankIdx] || [];
    const voiceIdx = Math.max(0, Math.min(voiceList.length - 1, Math.floor((rawVal / 4096) * voiceList.length)));
    return voiceList[voiceIdx] || '';
  }

  if (kDef.discrete) {
    const idx = Math.max(0, Math.min(kDef.discrete.length - 1, Math.floor((rawVal / 4096) * kDef.discrete.length)));
    const val = kDef.discrete[idx];
    if (kDef.param.startsWith('vol')) {
      return `${val}`;
    } else if (kDef.param === 'n' && type === 'every') {
      return `/${val}`;
    }
    return `${val}`;
  } else {
    if (kDef.param === 'pitch' || kDef.param === 'note') {
      return formatNote(scaleNote(rawVal));
    } else if (kDef.param === 'bpm') {
      return `${scaleBpm(rawVal)} BPM`;
    } else if (kDef.param === 'hz') {
      return `${rawVal} Hz`;
    } else if (kDef.param === 'cents') {
      const semitones = (rawVal - 2048) / 204.8;
      return semitones === 0 ? '0.0 ST' : `${semitones > 0 ? '+' : ''}${semitones.toFixed(1)} ST`;
    } else if (kDef.param === 'ch') {
      return rawVal === 0 ? 'OMNI' : `CH ${rawVal}`;
    } else {
      return `${Math.round(rawVal / 40.95)}%`;
    }
  }
}

function buildModuleEl(type, instanceId, params, leftPx) {
  const def = MODULE_DEFS[type];
  if (!def) return null;

  const hasKnobs = def.knobs && def.knobs.length > 0;
  const isIO = def.category === 'io';
  const mod = el('div', 'module' + (isIO ? ' mod-io' : '') + (hasKnobs ? '' : ' mod-knobless') + (def.hp === 2 ? ' mod-2hp' : ''));
  mod.id = `mod-${instanceId}`;
  mod.dataset.instanceId = instanceId;
  mod.dataset.type = type;
  mod.dataset.category = def.category; // Tag category for visual panel variations
  mod.style.width = (def.hp * HP) + 'px';
  mod.style.left = leftPx + 'px';

  // Screws: slim modules (HP < 6) only get 2 screws per Eurorack standard
  const isSlim = def.hp < 6;
  const screws = isSlim ? ['tl', 'br'] : ['tl', 'tr', 'bl', 'br'];
  for (const pos of screws) {
    const screwEl = el('div', `screw screw-${pos}`);
    const randRot = Math.floor(Math.random() * 360);
    screwEl.style.transform = `rotate(${randRot}deg)`;
    mod.appendChild(screwEl);
  }

  // Header Title on faceplate (positioned below top screws to avoid overlap)
  const title = el('div', 'module-title');
  if (type === 'dx' && params.customVoiceName) {
    title.textContent = `DX: ${params.customVoiceName}`;
  } else {
    title.textContent = def.title;
  }

  // Delete
  if (def.deletable !== false) {
    const delBtn = el('button', 'module-del-btn'); delBtn.textContent = '×';
    delBtn.addEventListener('click', e => { e.stopPropagation(); deleteModule(instanceId); });
    mod.appendChild(delBtn);
  }

  mod.appendChild(title);
  setupModuleDrag(title, mod, instanceId);

  // Score Player pattern input directly on faceplate
  if (type === 'score-player') {
    const wrap = el('div', 'pattern-input-wrap');
    const label = el('div', 'pattern-input-lbl', { textContent: 'SCORE PATTERN' });
    const input = el('textarea', 'module-pattern-input');
    input.value = params.pattern || '[c4 e4 g4 c5]';
    // Prevent typing from dragging module
    input.addEventListener('pointerdown', e => e.stopPropagation());
    input.addEventListener('mousedown', e => e.stopPropagation());
    input.addEventListener('change', e => {
      const mData = getModuleData(instanceId);
      if (mData) {
        mData.params.pattern = e.target.value;
      }
      generateCode();
    });
    wrap.appendChild(label);
    wrap.appendChild(input);
    mod.appendChild(wrap);
  }

  // Drum Sequencer step grid directly on faceplate
  if (type === 'drum-seq') {
    const gridWrap = el('div', 'drum-seq-grid-wrap');
    const channels = [
      { key: 'kickPat',  label: 'K', def: [1,0,0,0,1,0,0,0] },
      { key: 'snarePat', label: 'S', def: [0,0,1,0,0,0,1,0] },
      { key: 'hatPat',   label: 'H', def: [1,0,1,0,1,0,1,0] },
      { key: 'percPat',  label: 'P', def: [0,1,0,1,0,1,0,1] }
    ];
    for (const chan of channels) {
      const row = el('div', 'drum-seq-row');
      const lbl = el('span', 'drum-seq-row-lbl'); lbl.textContent = chan.label;
      row.appendChild(lbl);

      const pat = params[chan.key] || [...chan.def];
      params[chan.key] = pat;

      for (let stepIdx = 0; stepIdx < 8; stepIdx++) {
        const btn = el('button', 'drum-seq-step-btn' + (pat[stepIdx] ? ' active' : ''));
        btn.dataset.step = stepIdx;
        btn.dataset.channel = chan.key;
        btn.addEventListener('pointerdown', e => e.stopPropagation());
        btn.addEventListener('mousedown', e => e.stopPropagation());
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const mData = getModuleData(instanceId);
          if (mData) {
            if (!mData.params[chan.key]) {
              mData.params[chan.key] = [...chan.def];
            }
            mData.params[chan.key][stepIdx] = mData.params[chan.key][stepIdx] ? 0 : 1;
            btn.classList.toggle('active');
            generateCode();
          }
        });
        row.appendChild(btn);
      }
      gridWrap.appendChild(row);
    }
    mod.appendChild(gridWrap);
  }

  // Knobs: Layout class chosen dynamically (vertical vs grid vs hybrid)
  if (hasKnobs) {
    const layoutType = def.knobLayout || 'vertical';
    if (def.knobs.length === 3 && layoutType === 'vertical') {
      const knobArea = el('div', 'module-knobs knob-layout-hybrid');
      const k1 = def.knobs[0];
      const v1 = params[k1.param] !== undefined ? params[k1.param] : k1.def;
      knobArea.appendChild(buildKnobEl(type, instanceId, k1, v1));

      const row = el('div', 'knob-layout-hybrid-row');
      for (let i = 1; i < 3; i++) {
        const k = def.knobs[i];
        const v = params[k.param] !== undefined ? params[k.param] : k.def;
        row.appendChild(buildKnobEl(type, instanceId, k, v));
      }
      knobArea.appendChild(row);
      mod.appendChild(knobArea);
    } else {
      const isCompact = def.knobs.length > 6;
      const knobArea = el('div', `module-knobs knob-layout-${layoutType}${isCompact ? ' knobs-compact' : ''}`);
      for (const kDef of def.knobs) {
        const val = params[kDef.param] !== undefined ? params[kDef.param] : kDef.def;
        knobArea.appendChild(buildKnobEl(type, instanceId, kDef, val));
      }
      mod.appendChild(knobArea);
    }
  }

  // Ports: Unified grid of input and output jacks
  if (def.inputs.length > 0 || def.outputs.length > 0) {
    const ports = el('div', 'module-ports');
    const totalJacks = def.inputs.length + def.outputs.length;
    const useGrid4 = def.hp >= 10 && totalJacks >= 4;
    const useGrid2 = totalJacks > 2 && def.hp > 2;
    const gridClass = useGrid4 ? ' ports-grid-4' : (useGrid2 ? ' ports-grid-2' : '');
    const inner = el('div', 'ports-col-inner' + gridClass);

    for (const p of def.inputs) {
      inner.appendChild(buildJackEl(instanceId, p.id, p.label, 'input'));

    for (const p of def.outputs) {
      inner.appendChild(buildJackEl(instanceId, p.id, p.label, 'output'));
    }

    ports.appendChild(inner);
    mod.appendChild(ports);
  }

  return mod;
}

function buildKnobEl(type, instanceId, kDef, val) {
  const wrap = el('div', 'knob-wrap');
  const px   = KNOB_PX[kDef.size]  || 30;

function buildJackEl(instanceId, portId, label, direction) {
  if (portId.startsWith('spacer')) {
    const wrap = el('div', 'jack-wrap spacer-jack');
    wrap.style.visibility = 'hidden';
    wrap.style.pointerEvents = 'none';
    return wrap;
  }
  const wrap = el('div', 'jack-wrap');
  const lbl  = el('div', 'jack-lbl'); lbl.textContent = label;

  const jack = el('div', `jack jack-${direction}`);
  jack.id = `jack-${instanceId}-${portId}`;
  jack.dataset.instanceId = instanceId;
  jack.dataset.portId     = portId;
  jack.dataset.direction  = direction;
  jack.addEventListener('pointerdown', handleJackDown);

  jack.addEventListener('pointerenter', () => {
    hoveredJack = { instanceId, portId };
    redrawCables();
  });
  jack.addEventListener('pointerleave', () => {
    hoveredJack = null;
    redrawCables();
  });

  wrap.appendChild(lbl);
  wrap.appendChild(jack);
  return wrap;
}
