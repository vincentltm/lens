<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>'(flare) · patcher</title>
  <link rel="icon" href="lens-logo.svg">
  <style>/* ═══════════════════════════════════════════════════════════
   flare.css — Eurorack visual patcher, dark theme
   ═══════════════════════════════════════════════════════════ */

:root {
  --bg:          #080807;
  --panel:       #1d1c1a;
  --panel-hdr:   #111009;
  --panel-ports: #141311;
  --rail-metal:  linear-gradient(to bottom, #4a4a48 0%, #303030 40%, #202020 60%, #383836 100%);
  --wood:        #131416;
  --border-hi:   #2c2b28;
  --border-lo:   #0d0c0b;
  --ink:         #c0bab0;
  --ink-dim:     #706a60;
  --ink-label:   #9c9690;    /* port labels — clearly readable */
  --ink-gold:    #d4a84a;
  --accent:      #9fd08a;
  --err:         #e07a5f;
  --jack-grad:   radial-gradient(circle at 36% 30%, #3e3c39, #171614);
  --screw-grad:  radial-gradient(circle at 35% 28%, #888, #555 45%, #252422);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  height: 100vh;
  display: flex; flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font: 11px/1.4 ui-monospace, Menlo, 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ── Topbar ─────────────────────────────────────────────── */

.topbar {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: #0b0a09;
  border-bottom: 1px solid #1a1916;
  flex-shrink: 0; z-index: 1600;
}
.brand {
  font-size: 13px; font-weight: bold;
  color: var(--ink); margin-right: 6px; letter-spacing: .02em;
}
.brand span { color: var(--ink-dim); font-weight: normal; }

.topbar-sep {
  width: 1px; height: 18px;
  background: #222; margin: 0 4px;
}

button {
  background: #1c1b18; color: var(--ink);
  border: 1px solid #2a2926;
  border-radius: 3px; padding: 4px 10px;
  font: inherit; cursor: pointer; font-size: 11px;
  transition: border-color .1s, background .1s;
}
button:hover  { border-color: #46443e; background: #242220; }
button:active { background: #141311; }
button:disabled { opacity: .3; cursor: default; pointer-events: none; }

.btn-icon {
  background: none; border: none;
  font-size: 18px; color: var(--ink-dim);
  padding: 0 6px; line-height: 1;
}
.btn-icon:hover { color: var(--ink); background: none; }

#status {
  margin-left: auto; color: var(--ink-dim); font-size: 10px;
  max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#status.ok  { color: var(--accent); }
#status.err { color: var(--err); }

/* ── Module Browser Panel ───────────────────────────────── */

.browser-panel {
  position: fixed;
  top: 35px; left: 0; right: 0;
  background: #0d0c0b;
  border-bottom: 2px solid #1a1916;
  z-index: 1500;
  max-height: 55vh; overflow-y: auto;
  transform: translateY(-110%);
  visibility: hidden;
  transition: transform .18s cubic-bezier(.4,0,.2,1), visibility 0s .18s;
}
.browser-panel.open {
  transform: translateY(0);
  visibility: visible;
  transition: transform .18s cubic-bezier(.4,0,.2,1), visibility 0s;
}

.browser-search-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 8px;
  border-bottom: 1px solid #1a1916;
  position: sticky; top: 0; background: #0d0c0b; z-index: 10;
}
#browserSearch {
  flex: 1;
  background: #111009; color: var(--ink);
  border: 1px solid #2a2926; border-radius: 3px;
  padding: 5px 10px; font: inherit; outline: none;
}
#browserSearch::placeholder { color: var(--ink-dim); }

.browser-grid {
  display: flex; gap: 28px; flex-wrap: wrap;
  padding: 14px 16px 16px;
}

.browser-cat { flex: 0 0 auto; }
.browser-cat-title {
  font-size: 8.5px; text-transform: uppercase;
  letter-spacing: .14em; color: var(--ink-gold);
  margin-bottom: 8px;
}
.browser-cat-modules {
  display: flex; flex-direction: column; gap: 3px;
}
.browser-mod-btn {
  background: #1a1917; color: var(--ink);
  border: 1px solid #262421; border-radius: 2px;
  padding: 5px 12px; font: inherit; cursor: pointer;
  font-size: 10.5px; text-align: left;
  transition: background .1s, color .1s;
}
.browser-mod-btn:hover {
  background: #242220; border-color: #3a3835; color: var(--accent);
}

/* ── App body ───────────────────────────────────────────── */

.app-body {
  flex: 1; display: flex; min-height: 0;
}

/* ── Rack Viewport ──────────────────────────────────────── */

.rack-viewport {
  flex: 1; overflow: auto;
  background: #050403;
  padding: 20px 24px 28px;
}

/* ── Rack Case (wooden frame) ───────────────────────────── */

.rack-case {
  display: inline-flex; flex-direction: column;
  gap: 0;
  background: var(--wood);
  padding: 0 16px;
  border-radius: 5px;
  box-shadow:
    0 24px 64px rgba(0,0,0,.95),
    inset 2px 0 8px rgba(0,0,0,.4),
    inset -2px 0 8px rgba(0,0,0,.4);
  min-width: calc(100% - 0px);
}

/* ── Rack Row ───────────────────────────────────────────── */

.rack-row { display: flex; flex-direction: column; }
.rack-row + .rack-row { border-top: 10px solid var(--wood); }

.rail {
  height: 14px;
  background: var(--rail-metal);
  position: relative; flex-shrink: 0;
}
.rail.top  { border-top: 1px solid #666; border-bottom: 1px solid #111; }
.rail.bottom { border-top: 1px solid #111; border-bottom: 1px solid #555; }

/* Rail screw slots */
.rail::before {
  content: ''; position: absolute; top: 50%; left: 7.5px;
  width: calc(100% - 15px); height: 6px; margin-top: -3px;
  background: repeating-linear-gradient(
    to right, transparent 0, transparent 10px,
    #161614 10px, #161614 14px, transparent 14px, transparent 15px
  );
  opacity: .7;
}

/* ── Module Bay (HP-grid absolute positioning) ──────────── */

.module-bay {
  position: relative;
  z-index: 2;
  height: 380px;
  /* min-width set by JS */
  min-width: 100%;
  background: #0d0c0a;
  box-shadow: inset 0 6px 20px rgba(0,0,0,.7);
  overflow: visible; /* cables may extend above */
}

/* ── Module Panel ───────────────────────────────────────── */

.module {
  position: absolute;  /* HP-grid snapped */
  top: -14px;
  display: flex; flex-direction: column;
  height: 408px;
  background: var(--panel);
  border-left: 1px solid rgba(255,255,255,0.04);
  border-right: 1px solid rgba(0,0,0,0.4);
  box-shadow: 
    inset 1px 1px 0 rgba(255,255,255,0.06), 
    inset -1px -1px 0 rgba(0,0,0,0.5),
    0 10px 25px rgba(0,0,0,0.7);
  transition: opacity .12s;
  cursor: default;
  will-change: left;
}
.module.is-dragging { opacity: .25; cursor: grabbing; }

/* ── Category Faceplate Aesthetics ─────────────────────── */

/* 1. Hardware IO: Brushed titanium/dark steel look */
.module[data-category="io"] {
  background: linear-gradient(135deg, #424649 0%, #292a2b 100%);
  border-left: 1px solid rgba(255, 255, 255, 0.08);
  border-right: 1px solid rgba(0, 0, 0, 0.5);
  box-shadow: 
    inset 1px 1px 0 rgba(255,255,255,0.06),
    inset -1px -1px 0 rgba(0,0,0,0.45),
    0 10px 25px rgba(0,0,0,0.7);
}
.module[data-category="io"] .module-hdr {
  background: #2a2c2e;
  color: #c5c6c8;
  border-bottom: 1px solid #1c1d1f;
}
.module[data-category="io"] .port-sec-label { color: var(--ink-dim); }
.module[data-category="io"] .jack-lbl { color: var(--ink-label); }

/* 2. Oscillators: Obsidian & Gold */
.module[data-category="oscillators"] {
  background: linear-gradient(135deg, #161514 0%, #0d0c0c 100%);
  border-left: 1px solid rgba(230, 184, 96, 0.15);
  box-shadow: 
    inset 1px 1px 0 rgba(230, 184, 96, 0.08), 
    inset -1px -1px 0 rgba(0,0,0,0.6),
    0 10px 25px rgba(0,0,0,0.7);
}
.module[data-category="oscillators"] .module-hdr {
  background: #201e1a;
  color: #dfb86c;
  border-bottom: 1px solid #2e2b26;
}
.module[data-category="oscillators"] .knob::before {
  border-color: #dfb86c;
}
.module[data-category="oscillators"] .knob-lbl {
  color: #e6c88e;
}

/* 3. Filters: Charcoal & Green */
.module[data-category="filters"] {
  background: linear-gradient(135deg, #1c2320 0%, #101513 100%);
  border-left: 1px solid rgba(82, 183, 136, 0.15);
  box-shadow: 
    inset 1px 1px 0 rgba(82, 183, 136, 0.08), 
    inset -1px -1px 0 rgba(0,0,0,0.6),
    0 10px 25px rgba(0,0,0,0.7);
}
.module[data-category="filters"] .module-hdr {
  background: #141c19;
  color: #76c09a;
  border-bottom: 1px solid #1e2b26;
}
.module[data-category="filters"] .knob::before {
  border-color: #52b788;
}

/* 4. Waveshapers / Mixers: Slate / Steel Blue */
.module[data-category="shapers"] {
  background: linear-gradient(135deg, #1a1e26 0%, #0f1217 100%);
  border-left: 1px solid rgba(138, 158, 196, 0.15);
}
.module[data-category="shapers"] .module-hdr {
  background: #15181f;
  color: #8a9ec4;
  border-bottom: 1px solid #1f232e;
}
.module[data-category="shapers"] .knob::before {
  border-color: #7da0ca;
}

/* 5. Sound Generators (Voices): Crimson & Obsidian */
.module[data-category="voices"] {
  background: linear-gradient(135deg, #1a1010 0%, #0c0707 100%);
  border-left: 1px solid rgba(230, 57, 70, 0.15);
}
.module[data-category="voices"] .module-hdr {
  background: #1c1212;
  color: #e63946;
  border-bottom: 1px solid #2d1d1d;
}
.module[data-category="voices"] .knob::before {
  border-color: #e63946;
}
.module[data-category="voices"] .jack {
  border-color: #3b181a;
}

/* 6. Clocks: Amethyst Purple */
.module[data-category="clocks"] {
  background: linear-gradient(135deg, #1d1727 0%, #100b17 100%);
  border-left: 1px solid rgba(179, 157, 219, 0.15);
}
.module[data-category="clocks"] .module-hdr {
  background: #16111f;
  color: #b39ddb;
  border-bottom: 1px solid #231c30;
}
.module[data-category="clocks"] .knob::before {
  border-color: #b39ddb;
}

/* 7. MIDI: Industrial Amber */
.module[data-category="midi"] {
  background: linear-gradient(135deg, #222019 0%, #14130f 100%);
  border-left: 1px solid rgba(212, 175, 55, 0.15);
}
.module[data-category="midi"] .module-hdr {
  background: #1c1a14;
  color: #d4af37;
  border-bottom: 1px solid #2a271e;
}
.module[data-category="midi"] .knob::before {
  border-color: #d4af37;
}

/* 8. Math Utilities: Sunset Orange & Bronze */
.module[data-category="math"] {
  background: linear-gradient(135deg, #221b15 0%, #130f0c 100%);
  border-left: 1px solid rgba(244, 162, 97, 0.15);
}
.module[data-category="math"] .module-hdr {
  background: #1c1511;
  color: #f4a261;
  border-bottom: 1px solid #2a1f18;
}
.module[data-category="math"] .knob::before {
  border-color: #f4a261;
}

/* ── Screws ─────────────────────────────────────────────── */

.screw {
  position: absolute;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--screw-grad);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.06);
  z-index: 5;
}
.screw::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 68%; height: 1.5px; background: #1a1715;
  transform: translate(-50%,-50%) rotate(38deg);
}
.screw-tl { top: 2px;    left: 7.5px; }
.screw-tr { top: 2px;    right: 7.5px; }
.screw-bl { bottom: 2px; left: 7.5px; }
.screw-br { bottom: 2px; right: 7.5px; }

/* ── Module Title ───────────────────────────────────────── */

.module-title {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-dim);
  text-align: center;
  padding: 12px 10px 4px;
  cursor: grab;
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
  box-sizing: border-box;
}
.module-title:active { cursor: grabbing; }

/* Custom colors for category titles printed on plates */
.module[data-category="io"] .module-title { color: var(--ink-gold); }
.module[data-category="oscillators"] .module-title { color: #dfb86c; }
.module[data-category="filters"] .module-title { color: #52b788; }
.module[data-category="shapers"] .module-title { color: #8a9ec4; }
.module[data-category="voices"] .module-title { color: #e63946; }
.module[data-category="clocks"] .module-title { color: #b39ddb; }
.module[data-category="midi"] .module-title { color: #d4af37; }
.module[data-category="math"] .module-title { color: #f4a261; }

.module-del-btn {
  position: absolute;
  right: 12px;
  top: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--ink-dim);
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  opacity: 0.15;
  transition: all 0.2s ease-in-out;
  z-index: 10;
  line-height: 1;
}
.module:hover .module-del-btn {
  opacity: 0.6;
  background: rgba(255, 255, 255, 0.08);
}
.module-del-btn:hover {
  background: #e63946 !important;
  color: #fff !important;
  border-color: #e63946 !important;
  opacity: 1 !important;
  transform: scale(1.1);
  box-shadow: 0 0 8px rgba(230, 57, 70, 0.4);
}

/* ── Knob Area ──────────────────────────────────────────── */

.module-knobs {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px 10px;
  padding: 14px 8px;
  align-content: center;
}

/* Vertical knob layout (stacked neatly) */
.knob-layout-vertical {
  flex-direction: column;
  gap: 12px;
}

/* Grid knob layout (2x2 grid for ADSR/Mixer) */
.knob-layout-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  justify-items: center;
  align-items: center;
  gap: 10px 8px;
}

.module-knobs.knobs-compact {
  gap: 8px 6px;
  padding: 8px 4px;
}

.knob-layout-grid.knobs-compact {
  gap: 6px 4px;
}

.knob-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.knob {
  cursor: ns-resize;
  position: relative;
  display: block;
  z-index: 2;
  border-radius: 50%;
  box-shadow: 0 1px 0 rgba(255,255,255,0.05);
}

/* Collar/Bezel behind every knob to separate it from the panel */
.knob::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1px solid #4a4844;
  background: radial-gradient(circle, #2d2c29 60%, #151413 100%);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.08),
    0 2px 4px rgba(0,0,0,0.5);
  z-index: 1;
}

.knob svg {
  position: relative;
  z-index: 3;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.knob-lbl {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  line-height: 1.1;
  text-align: center;
  width: 100%;
}
.knob-lbl-name {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 8px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--ink-dim);
}
.knob-lbl-val {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 8px;
  font-weight: normal;
  color: var(--accent);
  margin-top: 1px;
}

/* ── Score Player Input Screen ──────────────────────────── */

.pattern-input-wrap {
  padding: 8px 12px;
  background: #090807;
  border-radius: 4px;
  border: 1px solid #23211f;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.8);
  margin: 6px 10px;
}
.pattern-input-lbl {
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #6a6864;
  text-align: left;
  margin-bottom: 4px;
}
.module-pattern-input {
  background: #030302;
  border: 1px solid #1c1a18;
  color: var(--accent);
  font: 11px/1.2 ui-monospace, Menlo, Monaco, Consolas, monospace;
  padding: 6px 8px;
  border-radius: 2px;
  outline: none;
  width: 100%;
  box-sizing: border-box;
  text-shadow: 0 0 4px rgba(159,208,138,0.6);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.9);
  resize: none;
  height: 48px;
  display: block;
}
.module-pattern-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 8px rgba(159,208,138,0.4), inset 0 1px 2px rgba(0,0,0,0.9);
}

/* ── Knobless Module Jack Alignment ─────────────────────── */

.mod-knobless .module-ports {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  padding: 24px 8px 30px;
  border-top: none;
  gap: 20px;
}

.mod-knobless .ports-col-inner.ports-grid-2 {
  gap: 16px 10px;
}

/* ── Port Area ──────────────────────────────────────────── */

.module-ports {
  flex-shrink: 0;
  background: var(--panel-ports);
  border-top: 1px solid rgba(0,0,0,0.3);
  padding: 8px 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Section header ("IN" / "OUT") above jack columns */
.port-sec-label {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .12em; color: var(--ink-dim);
  padding: 0 0 3px 0; display: block;
  width: 100%;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  margin-bottom: 4px;
}

.ports-col {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.ports-col-inner {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 8px;
  width: 100%;
}

.ports-col-inner.ports-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 10px;
  justify-items: center;
  align-items: center;
}

.ports-col-inner.ports-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px 6px;
  justify-items: center;
  align-items: center;
}

/* Jack wrapper: label + circle, stacked vertically */
.jack-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  width: 100%;
  max-width: 28px;
}
.jack-lbl {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 8px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--ink-label);
  text-align: center; line-height: 1.1;
  width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: clip;
}

/* ── Jack Socket ────────────────────────────────────────── */

.jack {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--jack-grad);
  border: 1.5px solid #252320;
  box-shadow:
    inset 0 1.5px 3px rgba(0,0,0,.85),
    0 1px 0 rgba(255,255,255,.04);
  cursor: pointer; position: relative;
  transition: box-shadow .08s;
  flex-shrink: 0;
}
/* Expand clickable/tappable hit target for easy manipulation */
.jack::before {
  content: ''; position: absolute;
  top: -8px; left: -8px;
  right: -8px; bottom: -8px;
  border-radius: 50%;
}
/* Inner hole */
.jack::after {
  content: ''; position: absolute;
  inset: 4px; border-radius: 50%;
  background: #040302;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.95);
}

/* Input jack: slightly warm border tint */
.col-in .jack  { border-color: #2c2a26; }
/* Output jack: slightly cooler border tint */
.col-out .jack { border-color: #252629; }

.jack:hover {
  box-shadow:
    inset 0 1.5px 3px rgba(0,0,0,.85),
    0 0 0 1.5px rgba(200,200,200,.18);
}
.jack.active {
  border-color: #fff !important;
  box-shadow: 0 0 10px rgba(255,255,255,.35) !important;
}
.jack.snap-target {
  border-color: var(--accent) !important;
  box-shadow: 0 0 12px rgba(159,208,138,.55) !important;
}

/* ── WS IO module special layout ───────────────────────── */

.mod-io .module-ports {
  background: #111009;
  flex-direction: column; gap: 4px;
}
.io-section {
  display: flex; flex-direction: column; gap: 4px;
}
.io-section-label {
  font-size: 7.5px; text-transform: uppercase; letter-spacing: .14em;
  color: var(--ink-gold); padding: 4px 4px 2px; opacity: .75;
}
.io-jacks-row {
  display: flex; gap: 4px; flex-wrap: wrap; padding: 0 4px;
}
.io-sep {
  height: 1px; background: #1e1c18; margin: 4px 4px 0;
}

/* ── Code Pane ──────────────────────────────────────────── */

.code-pane {
  width: 270px; flex-shrink: 0;
  display: flex; flex-direction: column;
  border-left: 1px solid #1a1916;
  background: #0b0a09;
  position: relative;
}
.code-pane-resizer {
  position: absolute;
  top: 0;
  left: -3px;
  width: 6px;
  height: 100%;
  cursor: ew-resize;
  background: transparent;
  transition: background 0.12s;
  z-index: 10;
}
.code-pane-resizer:hover, .code-pane-resizer.active {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
.code-pane-hdr {
  padding: 8px 12px;
  border-bottom: 1px solid #1a1916;
  font-size: 8.5px; text-transform: uppercase;
  letter-spacing: .12em; color: var(--ink-dim);
  flex-shrink: 0;
}
.code-area {
  flex: 1;
  background: transparent; color: var(--accent);
  border: none; padding: 12px;
  font: 11px/1.6 ui-monospace, Menlo, monospace;
  resize: none; outline: none; overflow-y: auto;
  white-space: pre;
}

/* ── Fixed Cable SVG ────────────────────────────────────── */

#cableSvg {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  pointer-events: none; z-index: 1000;
  overflow: visible;
}

/* ── Context Menu ────────────────────────────────────────── */

.context-menu {
  position: fixed;
  z-index: 2000;
  background: #121110;
  border: 1px solid #2d2c2a;
  border-radius: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.85);
  padding: 4px 0;
  font: 11px ui-monospace, Menlo, monospace;
  min-width: 150px;
}

.context-menu-item {
  position: relative;
  padding: 6px 14px;
  cursor: pointer;
  color: var(--ink);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.1s, color 0.1s;
}

.context-menu-item:hover {
  background: #242220;
  color: var(--accent);
}

.context-menu-submenu {
  position: absolute;
  left: 100%;
  top: -4px;
  background: #121110;
  border: 1px solid #2d2c2a;
  border-radius: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.85);
  padding: 4px 0;
  display: none;
  min-width: 150px;
}

.context-menu-item:hover .context-menu-submenu {
  display: block;
}

/* Context menu header (section label above cable list) */
.context-menu-header {
  padding: 5px 14px 3px;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--ink-dim);
  border-bottom: 1px solid #1e1d1b;
  margin-bottom: 2px;
}

/* Context menu divider */
.context-menu-sep {
  height: 1px;
  background: #1e1d1b;
  margin: 4px 0;
}

/* Danger action (Disconnect All) */
.context-menu-item-danger {
  color: var(--err) !important;
}
.context-menu-item-danger:hover {
  background: rgba(224,122,95,0.12) !important;
  color: var(--err) !important;
}

/* Jack incompatible dim during cable drag */
.jack.drag-incompatible {
  opacity: 0.25;
  pointer-events: none;
}


/* ── Hybrid 3-Knob Layout ───────────────────────────────── */

.knob-layout-hybrid {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 6px 4px;
  box-sizing: border-box;
}

.knob-layout-hybrid-row {
  display: flex;
  flex-direction: row;
  justify-content: space-around;
  width: 100%;
  gap: 4px;
}


/* ── Jack Input/Output Differentiation ──────────────────── */

.jack-input {
  border: 2px solid #5a5f63 !important;
  background: radial-gradient(circle, #3e4145 0%, #1e2022 100%) !important;
}
.jack-input:hover {
  border-color: #8c9399 !important;
  box-shadow: inset 0 1.5px 3px rgba(0,0,0,.85), 0 0 8px rgba(107,112,116,0.3) !important;
}

.jack-output {
  border: 2px solid #a3884e !important;
  background: radial-gradient(circle, #2e2612 0%, #110e05 100%) !important;
}
.jack-output:hover {
  border-color: #c9b07a !important;
  box-shadow: inset 0 1.5px 3px rgba(0,0,0,.85), 0 0 8px rgba(223,177,62,0.3) !important;
}

/* ── 2 HP Module Specifics ──────────────────────────────── */
.module.mod-2hp .module-ports {
  padding: 8px 1px 12px;
}
.module.mod-2hp .module-title {
  font-size: 7px;
  letter-spacing: 0;
  padding: 14px 2px 2px;
}
.module.mod-2hp .module-del-btn {
  display: none;
}
.module.mod-2hp .jack-wrap {
  max-width: 26px;
}
.module.mod-2hp .jack-lbl {
  font-size: 7.2px;
  letter-spacing: -0.02em;
}
.module.mod-2hp .knob-wrap {
  transform: scale(0.8);
  margin: 0 -4px;
}

/* ── Drum Sequencer Step Buttons ────────────────────────── */
.drum-seq-grid-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 10px;
  background: #090807;
  border-radius: 4px;
  margin: 10px 8px;
  border: 1px solid #23211f;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
}
.drum-seq-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.drum-seq-row-lbl {
  font-size: 10px;
  font-weight: 800;
  width: 14px;
  color: #6a6864;
  text-align: center;
  font-family: ui-monospace, monospace;
}
.drum-seq-step-btn {
  width: 15px;
  height: 20px;
  border-radius: 3px;
  border: 1px solid #1a1918;
  background: linear-gradient(to bottom, #3c3a38 0%, #242220 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.8);
  cursor: pointer;
  outline: none;
  padding: 0;
  transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
}
.drum-seq-step-btn:hover {
  border-color: #3a3835;
  background: linear-gradient(to bottom, #4c4a48 0%, #2e2c2a 100%);
}
.drum-seq-step-btn[data-channel="kickPat"].active {
  background: linear-gradient(to bottom, #ff5533 0%, #cc2200 100%);
  border-color: #ff8866;
  box-shadow: 0 0 10px rgba(255, 85, 51, 0.8), inset 0 1px 1px rgba(255,255,255,0.4);
}
.drum-seq-step-btn[data-channel="snarePat"].active {
  background: linear-gradient(to bottom, #ffaa00 0%, #cc7700 100%);
  border-color: #ffcc66;
  box-shadow: 0 0 10px rgba(255, 170, 0, 0.8), inset 0 1px 1px rgba(255,255,255,0.4);
}
.drum-seq-step-btn[data-channel="hatPat"].active {
  background: linear-gradient(to bottom, #00d2ff 0%, #0099cc 100%);
  border-color: #66e5ff;
  box-shadow: 0 0 10px rgba(0, 210, 255, 0.8), inset 0 1px 1px rgba(255,255,255,0.4);
}
.drum-seq-step-btn[data-channel="percPat"].active {
  background: linear-gradient(to bottom, #d200ff 0%, #9900cc 100%);
  border-color: #e566ff;
  box-shadow: 0 0 10px rgba(210, 0, 255, 0.8), inset 0 1px 1px rgba(255,255,255,0.4);
}

/* ── Premium State of the Art Aesthetics ────────────────── */



.knob:hover::before {
  border-color: var(--accent) !important;
  box-shadow: 
    inset 0 1px 1px rgba(255,255,255,0.12),
    0 0 6px rgba(159,208,138,0.45) !important;
}

/* Jack pulsing glow when it's a snap target during drag */
@keyframes jack-glow-pulse {
  0% { box-shadow: 0 0 8px rgba(159,208,138,.4); }
  50% { box-shadow: 0 0 18px rgba(159,208,138,.85); }
  100% { box-shadow: 0 0 8px rgba(159,208,138,.4); }
}

.jack.snap-target {
  animation: jack-glow-pulse 1.2s infinite ease-in-out;
}

e\" xmlns:serif=\"http://www.serif.com/\" style=\"fill-rule:evenodd;clip-rule:evenodd;\">\n    <g transform=\"matrix(1.187003,0,0,1.081446,-98.773863,-112.88704)\">\n        <path d=\"M96.868,109.317C96.868,106.931 95.679,104.953 93.293,104.953C90.907,104.953 89.868,106.743 89.868,109.129L90.053,117.668C90.053,119.457 91.503,120.908 93.293,120.908C95.083,120.908 96.533,119.457 96.533,117.668L96.868,109.317\" style=\"fill:rgb(158,161,164);fill-rule:nonzero;stroke:rgb(32,33,34);stroke-width:1px;\"/>\n    </g>\n</svg>","switchMid":"<svg width=\"100%\" height=\"100%\" viewBox=\"0 0 24 28\" version=\"1.1\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:space=\"preserve\" xmlns:serif=\"http://www.serif.com/\" style=\"fill-rule:evenodd;clip-rule:evenodd;\">\n    <g transform=\"matrix(0.84712,0,0,0.84712,1.834561,2.140322)\">\n        <circle cx=\"12\" cy=\"14\" r=\"4.5\" style=\"fill:rgb(158,161,164);stroke:rgb(32,33,34);stroke-width:1.5px;\"/>\n    </g>\n</svg>","switchDown":"<svg width=\"100%\" height=\"100%\" viewBox=\"0 0 24 28\" version=\"1.1\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xml:space=\"preserve\" xmlns:serif=\"http://www.serif.com/\" style=\"fill-rule:evenodd;clip-rule:evenodd;\">\n    <g transform=\"matrix(-1.187003,-0,0,-1.081446,122.758157,140.91833)\">\n        <path d=\"M96.868,109.317C96.868,106.931 95.679,104.953 93.293,104.953C90.907,104.953 89.868,106.743 89.868,109.129L90.053,117.668C90.053,119.457 91.503,120.908 93.293,120.908C95.083,120.908 96.533,119.457 96.533,117.668L96.868,109.317\" style=\"fill:rgb(158,161,164);fill-rule:nonzero;stroke:rgb(32,33,34);stroke-width:1px;\"/>\n    </g>\n</svg>"};</script>
<script>const LOUPE_PRESETS = {"discreet-system":"; after Eno's Discreet Music, though the similarity mostly stops at the name ;)\n; two scored melodic lines sent to external oscillators and slopes; their audio returns\n; are summed through a feedback delay.\n;   cv-out 1/2 = pitch     pulse-out 1/2 = trigger     audio-in 1/2 = voices back\n;   audio-out 1/2 = dry voice + echo     knob-main = feedback     knob-x = tempo     knob-y = voice 2 drift\n;   patch: cv-out 1/2 -> SineSquare 1/2 v/oct; pulse-out 1/2 -> Slope 1/2 trig;\n;          Slope 1/2 -> audio-in 1/2 (so the voices return for the feedback delay);\n;          audio-out 1/2 -> Mix.\n(patch\n  (def feedback (knob :main))\n  (def tempo    (knob :x))\n  (def drift    (bipolar (knob :y)))   ; noon = locked; either side drifts the voices apart\n\n  (def master (clock :tempo tempo))\n  (def b2     (follow master :mult 1 :drift drift))\n\n  ; _ = rest, ~ = tie (holds previous pitch)\n  (def t1 (score '(Eb5 _  F5 _ _ ~ ~ ~   C5 Ab4 _ _ ~ ~ ~ ~\n                   Eb4 _ _ _ ~ ~ ~ ~   Ab4 _ _ ~ ~ ~ ~ ~)))\n  (def t2 (score '(Db5 Eb5 _ _ ~ ~ ~ ~   F4 _ _ _ ~ ~ ~ ~\n                   Ab4 _ _ ~ ~ ~ ~ ~   F5 Ab5 Bb5 Ab5 _ ~ ~ ~)))\n\n  (def delaybuf (audio :seconds 1.7))\n  (def echo (tap delaybuf :amount VMAX :span))   ; fixed full-length delay, no glide\n\n  (<- (cv-out :1 :v-oct) (step (t1 :notes) :trig master))\n  (<- (pulse-out :1)     (onsets (t1 :rhythm) :trig master))\n  (<- (cv-out :2 :v-oct) (step (t2 :notes) :trig b2))\n  (<- (pulse-out :2)     (onsets (t2 :rhythm) :trig b2))\n\n  ; sum the dry voices with the attenuated echo, low-pass, then soft-clip into the\n  ; audio range before writing. the delay buffer is signed 12-bit and its write wraps\n  ; (not clamps), so an over-range value would flip polarity and crackle; saturate\n  ; keeps the feedback loop in range with a tape-like knee instead.\n  (def wet (lpf :in (add (mix (audio-in :1) (audio-in :2))\n                         (vca echo feedback))\n                :cut 1200))\n  (<- delaybuf (saturate wet) :per-sample)\n\n  (<- (audio-out :1) (mix (audio-in :1) echo))\n  (<- (audio-out :2) (mix (audio-in :2) echo)))\n","drum-designer":"; Drum designer: three built-in drum voices (kick / snare / hat) you shape live\n; and save. Tap the switch DOWN to step through the voices (kick -> snare -> hat);\n; LEDs 0..2 show the one you are editing. All three knobs shape the selected voice:\n;\n;   kick    main = decay   x = drive (clean..gritty)   y = sweep (pitch drop)\n;   snare   main = decay   x = snap (body..noise)      y = tone (noise colour)\n;   hat     main = decay   x = tone (full..thin)       y = pitch\n;\n; Knobs are soft-takeover, so paging never jerks a setting and every voice keeps\n; its own values. Hold the switch down ~5 s to save the kit to flash; the saved\n; values reload on power-up. (A save also steps the voice on by one.)\n;\n; pulse-in 1 = clock. Patch a clock and the kit plays in time; unpatched, an\n; internal tempo keeps it going. The default groove is kick four-on-the-floor,\n; a syncopated snare, and 16th-note hats.\n; Patch a per-voice trigger to play that voice directly instead of its pattern:\n;   pulse-in 2 = kick      cv-in 2 = hat   (snare plays its pattern only)\n; cv-in 1 = hat decay modulation: a bipolar CV added to the hat decay knob.\n;\n; audio-out 1 = kick      audio-out 2 = snare + hat\n; LEDs 0..2 = selected voice      LEDs 3..5 = hit flash (kick / snare / hat)\n(patch\n  (def master (normal (pulse-in :1) (clock :bpm 480)))   ; ext clock, else ~120 bpm 16ths\n\n  ; voice selection: a 0..2 counter that steps on each switch-down tap\n  (def page (edge (eq (switch :z) VMIN)))\n  (def vsel (hold v (mod (add v 1) 3) :trig page :init 0))\n\n  ; one soft-takeover knob per voice. It only moves while its voice is selected,\n  ; so each voice keeps its own value and the Z-save snapshots them to flash.\n  (def pk-main (fn (sel init) (pickup (knob :main) :on (eq vsel sel) :init init)))\n  (def pk-x    (fn (sel init) (pickup (knob :x)    :on (eq vsel sel) :init init)))\n  (def pk-y    (fn (sel init) (pickup (knob :y)    :on (eq vsel sel) :init init)))\n\n  ; default groove, clocked by master (one bar of 16ths). A voice follows its own\n  ; jack instead whenever that jack is patched.\n  (def k-trig (normal (pulse-in :2) (onsets (beat '(x . . . x . . . x . . . x . . .)) master)))\n  ; read a clock/trigger from a CV jack: fire when the signal swings clear of its\n  ; resting midpoint. Works for either polarity and resets cleanly each pulse,\n  ; where a midpoint schmitt would latch high on a 0..+5V gate and never retrigger.\n  (def cv-trig (fn (cv) (edge (gt (abs (sub cv VMID)) 400))))\n\n  (def s-trig (onsets (beat '(. . x . . x . . x . . . x . . .)) master))\n  (def h-trig (if (connected (cv-in :2))\n                  (cv-trig (cv-in :2))\n                  (onsets (beat '(x x x x x x x x x x x x x x x x)) master)))\n\n  (def kick-v (kick :trig  k-trig\n                    :midi  C2\n                    :decay (pk-main 0 2600)\n                    :drive (pk-x    0 800)\n                    :sweep (pk-y    0 1800)))\n\n  (def snare-v (snare :trig   s-trig\n                      :decay  (pk-main 1 1100)\n                      :snappy (pk-x    1 2600)\n                      :tone   (pk-y    1 2048)))\n\n  (def hat-v (hat :trig  h-trig\n                  :decay (add (pk-main 2 700) (cv-in :1 :bipolar))   ; knob + cv-in 1\n                  :tone  (pk-x    2 2600)\n                  :midi  (add 81 (spread (pk-y 2 2048) 24))))   ; pitch sweeps A5..A7\n\n  (<- (audio-out :1) kick-v)\n  (<- (audio-out :2) (mix snare-v hat-v))\n\n  ; LEDs 0..2 mark the selected voice; 3..5 flash on each voice's hit\n  (<- (led :0) (if (eq vsel 0) 4095 0))\n  (<- (led :1) (if (eq vsel 1) 4095 0))\n  (<- (led :2) (if (eq vsel 2) 4095 0))\n  (<- (led :3) (envelope :trig k-trig :decay 600))\n  (<- (led :4) (envelope :trig s-trig :decay 600))\n  (<- (led :5) (envelope :trig h-trig :decay 600)))\n","drum-kit":"; a 4-voice drum kit (kick / tom / snare / hat) built natively in loupe.\n;   switch-z up/middle = beat at clock rate (clocked by pulse-in 1, or internal tempo if unpatched)\n;   switch-z down      = STUTTER: beat rolls at 4x while held\n;   knob-main = wavefold distortion     knob-x = tempo (used when pulse-in-1 unpatched)\n;   audio-out 1/2 = mixed kit (same on both)\n\n(def tone-drum (fn (:trig :pitch :sweep :decay => :out)\n  (def amp  (envelope :trig trig :decay decay))\n  (def bend (spread (envelope :trig trig :decay (div decay 3)) sweep))   ; pitch envelope is 3x faster\n  (<- out (vca (sine (add pitch bend)) amp))))\n\n(def noise-drum (fn (:trig :cut :decay => :out)\n  ; noise band: high-pass roar shaped by a low-pass to leave a usable band.\n  (<- out\n      (vca (envelope :trig trig :decay decay))   ; envelope is the amp\n      (lpf :cut cut)\n      (hpf :cut (div cut 2))\n      (noise))))\n\n(patch\n  (def master  (clock :bpm 200))\n  (def clk     (normal (pulse-in :1) master))\n  (def beatclk (if (eq (switch :z) VMIN) (follow clk :mult 4) clk))\n\n  (def kick-beat  (beat '(x . . . x . . .)))   ; four-on-the-floor\n  (def snare-beat (beat '(. . x . . . x .)))   ; backbeat\n  (def hat-beat   (beat '(x . x . x . x .)))   ; eighths\n  (def tom-beat   (beat '(. . . . . . x .)))   ; fill on 7\n\n  (def kick-t  (onsets kick-beat  beatclk))\n  (def tom-t   (onsets tom-beat   beatclk))\n  (def snare-t (onsets snare-beat beatclk))\n  (def hat-t   (onsets hat-beat   beatclk))\n\n  (def kick  (tone-drum  :trig kick-t  :pitch Ab2 :sweep 60 :decay 1300))\n  (def tom   (tone-drum  :trig tom-t   :pitch G3  :sweep 36 :decay 1100))\n  (def snare (noise-drum :trig snare-t :cut 800  :decay 700))\n  (def hat   (noise-drum :trig hat-t   :cut 4000 :decay 400))\n\n  (<- (audio-out :1) (wavefold (mix kick snare tom hat) (knob :main)))\n  (<- (audio-out :2) (wavefold (mix kick snare tom hat) (knob :main)))\n  (<- (led :0) (envelope :trig kick-t :decay 1300)))\n","drum-machine":"; two drum kits (straight and latin) A/B'd live by the Z-switch, using the groove DSL.\n;   knob-main = tempo     knob-x = kick drive (clean..punchy)     knob-y = hat decay (tight..open)\n;   switch-z  = up = LATIN,  middle/down = STRAIGHT     audio-out 1/2 = kit (mono)\n;   patch: audio-out-1 -> Mix. nothing external needed; drums are internal.\n;\n; named rhythms: four-on-floor backbeat eighths offbeat sixteenths downbeat\n;                tresillo cinquillo habanera son-clave rumba-clave bossa\n; or roll your own: (beat x..x..x.) or (euclid pulses steps)\n\n(patch\n  (def tempo (knob :main))\n  (def punch (knob :x))\n  (def open  (knob :y))\n  (def clk   (clock :tempo tempo))\n\n  ; a straight backbeat kit\n  (def straight\n    (groove :trig clk\n      (kick  :on four-on-floor :note A1 :drive punch :sweep 3700 :decay 1500)\n      (snare :on backbeat      :note C3 :snappy 3600 :tone 2800  :decay 1350)\n      (hat   :on eighths       :note A5 :tone 3200   :decay open)))\n\n  ; a latin kit\n  (def latin\n    (groove :trig clk\n      (kick  :on son-clave      :note A1 :drive punch :sweep 3500 :decay 1800)\n      (snare :on tresillo       :note C3 :snappy 2200 :tone 2600  :decay 1250)\n      (hat   :on (euclid 11 16) :note A5 :tone 3400   :decay open)))\n\n  (def kit (if (eq (switch :z) VMAX) latin straight))\n  (<- (audio-out :1) kit)\n  (<- (audio-out :2) kit)\n  (<- (led :0) (hits four-on-floor clk)))\n","fm-drum":"; 2-operator FM drum. Carrier body + modulator colour.\n;   z-switch down/middle/up = kick / tom / cymbal-cowbell character\n;   knob-main = pitch within mode (each mode centres on a different OCTAVE)\n;   knob-x    = FM ratio (within the mode's ratio range)\n;   knob-y    = decay\n;   pulse-in-1 = trigger (else falls back to four-on-floor)\n;   cv-bi-1    = pitch CV, +/- 2 octaves\n(patch\n  (def trig (normal (pulse-in :1) (onsets four-on-floor)))\n\n  ; ---- modes: three presets indexed by the Z-switch position ----\n  ; down(0) = kick   middle(1) = tom   up(2) = cymbal\n  ; (switch :z) reads rails (VMIN/VMID/VMAX); squint spreads them across each list.\n  (def mode (switch :z))\n  (def mode-root  (squint '(C1 C3 C4) mode))   ; base pitch (cymbal lower for FM headroom)\n  (def mode-ratio (squint '(0 19 34)  mode))   ; modulator offset in semitones (~FM ratio 1:3:7)\n  (def mode-decay (squint '(800 600 1500) mode))   ; kick / tom / cymbal base decay\n\n  ; ---- pitch: mode root + knob sweep + bipolar CV (+/- 2 octaves) ----\n  (def c-note (add mode-root\n                   (add (spread (knob :main) OCTAVE)\n                        (div (cv-in :1 :bipolar) (div VMID (mul OCTAVE 2))))))\n\n  ; ---- FM ratio: modulator sits mode-ratio semitones above the carrier; knob-x bends\n  ; it +/- one octave. Kept in MIDI range so the sweep always has effect (incl. cymbal). ----\n  (def m-note  (add c-note (add mode-ratio (sub (spread (knob :x) 24) 12))))\n\n  ; ---- decay: mode scale + knob-y scaling ----\n  (def decay   (add mode-decay (spread (knob :y) 3000)))\n\n  (def mod-env  (envelope :trig trig :decay (div decay 3)))\n  ; FM index = how deep the modulator drives the carrier's phase: bright on attack\n  ; (mod-env), decaying to a clean tone. cv-in 1 is bipolar so an unpatched jack adds\n  ; nothing; patch a CV to sweep the timbre. Scaling the MODULATOR sets the index;\n  ; carrier amplitude is the amp-env on the vca, so the output stays in range.\n  (def fm-index (add mod-env (cv-in :1 :bipolar)))\n\n  (def amp-env  (envelope :trig trig :decay decay))\n  (def carrier  (sine c-note :pm (vca (sine m-note) fm-index)))\n\n  (<- (audio-out :1) (vca carrier amp-env))\n  (<- (audio-out :2) (vca carrier amp-env))\n  (<- (pulse-out :1) trig))\n","hello-lfo":"; a sine with knob-controlled pitch, vibrato depth, and vibrato speed.\n;   knob-main = pitch (C3 to B4, 24 semitones)\n;   knob-x    = vibrato depth (CCW = none, CW = wide)\n;   knob-y    = vibrato speed (~0 to ~30 Hz)\n;   audio-out-1 = sine + vibrato\n;\n; :hz X accepts a literal Hz value or a stream. A streamed :hz reads the value\n; directly as Hz, so (spread knob-y 30) gives 0..29 Hz across the knob's travel.\n(patch\n  (def pitch (add C3 (spread (knob :main) 24)))\n  (<- (audio-out :1) (sine pitch :pm (sine :hz (spread (knob :y) 30)) :depth (knob :x))))\n","hello-seq":"; a 4-note minor arpeggio stepping once per master tick.\n;   knob-x = tempo     audio-out-1 = arpeggio voice\n;   cv-out-1 = pitch     pulse-out-1 = trigger\n(patch\n  (def master (clock :tempo (knob :x)))\n  (def melody (tape '(C3 Eb3 G3 Bb3)))\n\n  (def voice  (step melody))\n\n  (<- (cv-out :1 :v-oct) voice)\n  (<- (pulse-out :1)     (trig))\n  (<- (audio-out :1)     (sine voice)))\n","hello":"; one sine, main knob picks the pitch across two octaves starting at C3.\n;   knob-main = pitch (C3 to B4)     audio-out-1 = sine\n;\n; (spread knob-main 24) divides the knob into 24 semitone buckets. Each bucket\n; is about 170 ADC units wide, comfortably outside the framework's knob jitter,\n; so the pitch sits stably on each semitone. C3 env-resolves to MIDI 48;\n; the positional pitch on sine is in MIDI domain (no auto-spread).\n(patch\n  (<- (audio-out :1) (sine (add C3 (spread (knob :main) 24)))))\n","just-a-kick":"; a dedicated kick drum module with full CV and knob control.\n;   knob-main = decay (cv-bi-2 adds)     knob-x = drive     knob-y = pitch sweep\n;   switch-z  = OCTAVE (down = C1, middle = C2, up = C3)\n;   cv-bi-1   = pitch offset (+-12 semitones)     pulse-in-1 or pulse-in-2 = trigger\n;   audio-out 1/2 = kick (mono)     cv-out-1 = pitch as v/oct\n;   cv-out-2  = inverted amp envelope (for sidechaining: high at rest, dips on kick)\n;   pulse-out-1 = trigger thru     pulse-out-2 = /2 of trigger\n;   patch: pulse-in-1 <- a clock (e.g. 4-voltages or another pulse source);\n;          audio-out-1 -> Mix; cv-out-2 -> VCA on a bass you want to duck under the kick.\n(patch\n  (def OCTAVE-base (squint '(C1 C2 C3) (switch :z)))   ; switch pos down/mid/up = C1/C2/C3\n  (def pitch       (add OCTAVE-base (spread (cv-in :1 :bipolar) OCTAVE)))  ; +-12 semis\n  (def decay       (add (knob :main) (cv-in :2 :bipolar) :sat))\n  (def drive       (knob :x))\n  (def sweep       (knob :y))\n  (def clk-fall (normal (pulse-in :1) (onsets four-on-floor)))\n  (def trig     (or clk-fall (pulse-in :2)))\n\n  (def voice (kick :midi pitch :decay decay :drive drive :sweep sweep :trig trig))\n\n  (def amp     (envelope :trig trig :decay decay))\n  (def ducker  (sub VMAX amp))\n\n  (<- (audio-out :1)     voice)\n  (<- (audio-out :2)     voice)\n  (<- (cv-out :1 :v-oct) pitch)\n  (<- (cv-out :2)        ducker)\n  (<- (pulse-out :1)     trig)\n  (<- (pulse-out :2)     (toggle trig)))\n","meta-turing-machine":"; like turing-machine.loupe but hunts the transformations applied to a fixed tune, not the notes.\n;   knob-main = program mutation rate     knob-x = tempo     knob-y = tune mutation rate\n;   switch up = voice 2 drifts against voice 1 (phasing); down/mid = locked\n;   cv-out 1/2 = plain tune / transformed     pulse-out 1/2 = trigger\n;   patch: cv-out 1/2 -> SineSquare 1/2 v/oct; pulse-out 1/2 -> Slope 1/2 trig;\n;          Slope 1/2 -> Mix. audio-out 1/2 carry bench sines as a dry monitor.\n\n; the four ops; each maps a note to a note\n(def same (fn (:n) n))\n(def up   (fn (:n) (transpose n  12)))\n(def flip (fn (:n) (sub 120 n)))\n(def down (fn (:n) (transpose n -12)))\n(def ops  (lens same up flip down))   ; a lens turns byte k on a tape into op k\n\n(patch\n  ; clocks\n  (def master (clock :tempo (knob :x)))\n  (def bar    (follow master :div 4))\n  (def drift  (follow master :mult 15 :div 16))   ; voice-2 tune clock, 1 beat slower per 16: phases in/out\n\n  ; tapes\n  (def tune (tape '(C4 E4 G4 B4)))\n  (def prog (tape ops '(same up flip down)))\n\n  ; keep-or-replace: rewrite the program tape each bar, the tune each beat\n  (<- prog (if (chance (knob :main) :trig bar)\n               (step prog :trig bar)\n               (random :trig bar))\n           :trig bar)\n  (<- tune (if (chance (knob :y))\n               (step tune)\n               (snap (add C3 (spread (random) 25)) :scale minor)))\n\n  ; voice 1 = the tune, stepped on the beat\n  (def v1 (step tune))\n\n  ; voice 2 = the program transform applied to a note. switch up: read the tune on the\n  ; slow drift clock so the voices slide in/out of phase; else the locked v1. Select the\n  ; NOTE (cheap) so there is a single transform chain, not one per branch.\n  (def v2note (if (gt (switch :z) VMID)\n                  (step tune :trig drift)\n                  v1))\n  (def v2     ((thru ops (step prog :trig bar)) v2note))\n\n  (def trig (trig master))\n\n  (<- (cv-out :1 :v-oct) v1)\n  (<- (cv-out :2 :v-oct) v2)\n  (<- (pulse-out :1)     trig)\n  (<- (pulse-out :2)     trig)\n  ; bench-monitor sines so audio-out 1/2 carry the two voices dry when no external V/oct is wired.\n  (<- (audio-out :1)     (sine v1))\n  (<- (audio-out :2)     (sine v2))\n  (<- (led :0)           (step prog :trig bar))               ; current op index\n  (<- (led :5)           (envelope :trig trig :decay 500)))   ; tempo blink\n","midi-cvgate":"; MIDI -> 2-channel CV/gate converter (USB device).\n; Two monophonic voices, one per MIDI channel, set here in the patch. The pitch\n; holds between notes (parser default), so the oscillator stays on the last note\n; while the gate closes it -- no warble in the gaps.\n;   cv-out 1/2 = pitch (v/oct)   pulse-out 1/2 = gate\n;   MIDI channel 1 -> voice 1     MIDI channel 2 -> voice 2\n;   For triggers instead of gates, wrap the gate: (edge (midi-gate :ch N)).\n(patch\n  (<- (cv-out :1 :v-oct) (midi-note :ch 1))\n  (<- (pulse-out :1)     (midi-gate :ch 1))\n  (<- (cv-out :2 :v-oct) (midi-note :ch 2))\n  (<- (pulse-out :2)     (midi-gate :ch 2)))\n","midi-out":"; CV + gate -> MIDI note out, knob -> CC out (USB device).\n; Connect USB-C to a DAW. The Computer sends MIDI notes and CC.\n;   cv-in 1    = pitch (0..127 MIDI note number)\n;   pulse-in 1 = gate (high = note on)\n;   knob main  = CC1 value\n(patch\n  (<- (midi-note-out :ch 1) (cv-in :1) :gate (pulse-in :1))\n  (<- (midi-cc-out :ch 1 :cc 1) (knob :main)))\n","rungler-workshop":"; Benjolin / rungler brain for the WORKSHOP oscillators (cross-FM done in analog).\n; The Computer reads both oscillators, runs the comparator + shift-register rungle,\n; and sends CV back to re-tune them. Osc 2 is the rungle clock and is itself re-tuned\n; by the rungle (the tail-chasing trick); knob-x sets how hard, sliding from a clean\n; stepped sequence into self-modulating chaos. Two decorrelated rungle voltages drive\n; the left and right filters, so the stereo image moves on its own.\n;   knob-main = rungle depth   (how far the stepped voltage re-tunes the voice osc 1)\n;   knob-x    = chaos          (how hard the rungle re-tunes the clock osc 2: 0 = steady)\n;   knob-y    = sweep          (shifts both oscillator pitches together)\n;   switch up = freeze         (lock the rungle pattern into a repeating loop)\n;   cv-in 1   = external sweep  (sums with knob-y, to sequence the pitches)\n;   pulse-in 1 = external clock (overrides osc 2 as the rungle clock when patched)\n; patch it up (osc 2 = the slower one):\n;   osc 1 out -> audio-in 1     osc 2 out -> audio-in 2\n;   cv-out 1 -> osc 1 pitch CV  cv-out 2 -> osc 2 pitch CV\n;   audio-out 1 -> LEFT filter cutoff   audio-out 2 -> RIGHT filter cutoff\n;   osc 1 -> left mixer channel, osc 2 -> right mixer channel (pan hard for width)\n;   pulse-out 1 = rungle clock   pulse-out 2 = rungle gate (trigger envelopes)\n(patch\n  (def o1 (audio-in :1))                          ; analog oscillator 1 (voice + data)\n  (def o2 (audio-in :2))                          ; analog oscillator 2 (clock)\n\n  ; comparators. osc 2 clocks the register; an external clock overrides it when patched.\n  (def c1  (mask (gt o1 0) 1))                    ; osc 1 sign bit = rungle data\n  (def clk (normal (pulse-in :1) (schmitt o2 :lo -100 :hi 100)))\n\n  ; freeze: switch up locks the 8-bit pattern into a loop\n  (def lock (mask (gt (switch :z) VMID) 1))\n  (def run  (sub 1 lock))\n\n  ; nonlinear feedback shift register. running: data = osc 1 XOR the oldest stage.\n  ; locked: pure recirculation, so the bits just cycle.\n  (def reg (tape '(0 1 1 0 1 0 0 1)))\n  (def din (xor (tap reg :amount 8) (mul run c1)))\n  (<- reg din :trig clk)\n\n  ; two rungle DACs from different stages, so the two filters sweep out of step:\n  ;   A = the three newest stages   B = the next three (a 3-step canon behind A)\n  (def runA (div (mul (add (add (mul (tap reg :amount 1) 4) (mul (tap reg :amount 2) 2)) (tap reg :amount 3)) VMAX) 7))\n  (def runB (div (mul (add (add (mul (tap reg :amount 4) 4) (mul (tap reg :amount 5) 2)) (tap reg :amount 6)) VMAX) 7))\n  (def levelA (add (add (mul (tap reg :amount 1) 4) (mul (tap reg :amount 2) 2)) (tap reg :amount 3)))  ; 0..7 for pitch\n\n  ; pitch CV: shared sweep + the rungle. the clock osc only gets the rungle scaled by\n  ; chaos, so knob-x slides from a steady clock (clean sequence) to a self-modulating one.\n  (def sweep  (add (div (sub (knob :y) VMID) 2) (cv-in :1 :bipolar)))   ; knob + external\n  (def depth  (spread (knob :main) 290))                                ; rungle depth per level (up to ~full CV range)\n  (def voiceFM (mul levelA depth))                                      ; rungle -> osc 1\n  (def clockFM (div (mul voiceFM (knob :x)) VMAX))                      ; rungle -> osc 2 (chaos)\n\n  (<- (cv-out :1)    (add sweep voiceFM))         ; -> osc 1 pitch\n  (<- (cv-out :2)    (add sweep clockFM))         ; -> osc 2 pitch\n  (<- (audio-out :1) (sub runA VMID))             ; rungle A -> LEFT filter cutoff\n  (<- (audio-out :2) (sub runB VMID))             ; rungle B -> RIGHT filter cutoff\n  (<- (pulse-out :1) clk)                         ; rungle clock\n  (<- (pulse-out :2) (gt runB VMID))              ; slower rungle gate\n\n  ; LEDs: the three newest register bits, then the two rungle levels, then freeze\n  (<- (led :0) (mul (tap reg :amount 1) VMAX))\n  (<- (led :1) (mul (tap reg :amount 2) VMAX))\n  (<- (led :2) (mul (tap reg :amount 3) VMAX))\n  (<- (led :3) runA)\n  (<- (led :4) runB)\n  (<- (led :5) (mul lock VMAX)))\n","rungler":"; benjolin (after rob hordijk): two oscillators cross-modulate through a rungler.\n; the rungler is a shift register clocked by osc2, fed osc1's comparator bit XORed\n; back on itself (a nonlinear feedback shift register). its stepped voltage is the\n; CV that re-tunes both oscillators, so the whole thing chases its own tail.\n; for the full rungler sound, run audio-out-1 into the workshop filter with the rungle\n; (cv-out-1) on its cutoff, then add a touch of FM and resonance: that filtered, resonant\n; sweep is where it really sings.\n;   knob-x = osc1 pitch (the audible voice)\n;   knob-y = osc2 pitch = rungler CLOCK rate (turn down for a slow stepped sequence, up for audio-rate chaos)\n;   knob-main = rungler amount (0 = stable drone, up = the rungle sweeps the pitches into chaos)\n;   switch up = freeze the rungler: the current pattern locks into a repeating loop\n; jacks (patch into the workshop filter):\n;   audio-out-1 = both oscs mixed     -> filter audio in\n;   cv-out-1    = rungle voltage (stepped)  -> filter cutoff (add resonance + a little FM)\n;   cv-out-2    = rungle voltage (smoothed) -> filter cutoff for gliding sweeps instead\n;   audio-out-2 = osc1 alone          -> filter the oscillators separately, or use as a mod source\n;   pulse-out-1 = rungler clock (osc2 edges) -> sync the rest of the system\n;   audio-in-1  = optional analog feedback: patch the filter out back here and it joins the\n;                 rungler's data, folding the analog filter into the digital chaos (inert if unpatched)\n(patch\n  (def amount (spread (knob :main) 13))              ; rungler depth: 0..12 semitones per rungle level\n  (def p1 (add 30 (spread (knob :x) 49)))            ; osc1 pitch: notes 30..78 (the audible voice)\n  (def p2 (spread (knob :y) 73))                     ; osc2 = clock: notes 0..72 (~8 Hz slow .. ~660 Hz audio)\n\n  ; the rungler register, seeded so it never starts on a fixed point\n  (def reg (tape '(0 1 1 0 1 0 0 1)))\n\n  ; rungler DAC: the three most-recent stages, binary weighted (0..7), scaled to full scale\n  (def rungle3 (add (add (mul (tap reg :amount 1) 4)\n                         (mul (tap reg :amount 2) 2))\n                    (tap reg :amount 3)))\n  (def rungle  (div (mul rungle3 VMAX) 7))           ; 0..7 -> VMIN..VMAX\n\n  ; the rungle voltage is the CV that drives both oscillators' pitch (independent base pitches)\n  (def fm (mul rungle3 amount))\n  (def pitch1 (add p1 fm))\n  (def pitch2 (add p2 fm))\n\n  ; one phasor per voice: its ramp drives the rungler timing (comparator + clock) and,\n  ; via :phase, the audio triangles below, so they stay phase-coherent\n  (def o1 (phasor pitch1))                           ; ramp: osc1 comparator source\n  (def o2 (phasor pitch2))                           ; ramp: rungler clock\n\n  ; nonlinear feedback shift register: recirculate the oldest stage, and while running\n  ; XOR in fresh data (osc1 comparator XOR the filter return). switch UP stops the fresh\n  ; data, so the register just loops its 8 bits = the current pattern locks. clocked by osc2.\n  (def c1   (mask (gt o1 VMID) 1))                   ; osc1 ramp split at its midpoint\n  (def fb   (mask (gt (audio-in :1) VMID) 1))        ; filter feedback bit (0 when unpatched)\n  (def lock (mask (gt (switch :z) VMID) 1))          ; switch up = freeze: lock the pattern into a loop\n  (def run  (sub 1 lock))\n  ; din = comparator XOR oldest-stage XOR a tail term. running tail = fb; locked tail = c1,\n  ; which cancels c1 so din = oldest-stage (pure recirculation = the pattern loops). the lock\n  ; rides the fb side so the comparator's feedback path keeps its exact depth (no added z-1).\n  (def din (xor (xor c1 (tap reg :amount 8))\n                (add (mul run fb) (mul lock c1))))\n  (<- reg din :trig o2)\n\n  (<- (audio-out :1) (mix (triangle :phase o1) (triangle :phase o2)))\n  (<- (audio-out :2) (triangle :phase o1))           ; osc1 alone\n  (<- (cv-out :1)    (cv rungle))                    ; rungle voltage, stepped\n  (<- (cv-out :2)    (cv (slew rungle :rate 500)))   ; rungle voltage, smoothed (gliding cutoff)\n  (<- (pulse-out :1) (trig o2))                      ; rungler clock, one pulse per osc2 cycle\n  (<- (led :0)       rungle))\n","turing-machine":"; a loop of notes that slowly rewrites itself; main controls mutation rate.\n;   knob-main = mutation (CW = locked loop, CCW = pure random)\n;   knob-x = tempo (used when pulse-in-1 is unpatched)\n;   knob-y = active length\n;   pulse-in-1 = external clock (patch one in and it takes over from knob-x)\n;   cv-out-1 = pitch     pulse-out-1 = clock trigger\n;   patch: cv-out-1 -> SineSquare v/oct; pulse-out-1 -> Slope trig; Slope -> Mix.\n(patch\n  (def master (normal (pulse-in :1) (clock :tempo (knob :x))))\n  (def loop (tape '(C3 Eb3 G3 Bb3 C4 Bb3 G3 Eb3)))\n\n  ; knob-y picks the active loop length, 1..(len loop) cells: 1 = single-cell\n  ; repeat, full = the whole loop. Spread the knob across the tape's own length.\n  (def length (add 1 (spread (knob :y) (len loop))))\n\n  ; keep the current step, or replace with a random note in a 2-OCTAVE window from C3.\n  ; (random) spans 0..4095, far above MIDI range; the window keeps replacements musical.\n  (<- loop (if (chance (knob :main))\n               (step loop :len length)\n               (snap (add C3 (spread (random) 25)) :scale minor))\n           :len length)\n\n  (<- (cv-out :1 :v-oct) (step loop :len length))\n  (<- (pulse-out :1)     (trig))\n  (<- (led :0)           (step loop :len length)))\n","utility-pair":"; two utilities in a chain: a wavefolder feeding a lopass gate.\n;   audio-out 1 = the input, wavefolded. audio-out 2 = that fold through a\n;   plucked lopass gate. standalone it sings on its own; patch jacks to take over.\n; jacks (all normalled, so it works with nothing patched):\n;   audio-in 1  source to fold        (normalled to an internal sine)\n;   audio-in 2  lopass-gate input     (normalled to the folded signal)\n;   pulse-in 1  ping the lopass gate  (normalled to an internal four-on-floor)\n;   cv-out 2 = the folder's random voltage   pulse-out 2 = its /2 divider\n; knobs: main = fold drive, x = tempo, y = pluck length.\n; swap either (use ...) for another file from\n; https://github.com/grsr/lens/tree/main/patches/utility-pair to try a different utility.\n(use utility-pair/lopass-gate)\n(use utility-pair/wavefolder)\n(patch\n  (def beat (clock :tempo (knob :x)))\n  (def src  (normal (audio-in :1) (sine :hz 110)))\n  (def wf   (wavefolder :in src :drive (knob :main) :trig beat :steps 4))\n  (<- (audio-out :1) (wf :out))\n  (<- (cv-out :2)    (wf :random))\n  (<- (pulse-out :2) (wf :clock))\n\n  (def lpg-in (normal (audio-in :2) (wf :out)))\n  ; internal four-on-floor always plucks; an external pulse adds hits on top.\n  (def ping   (max (onsets four-on-floor beat) (pulse-in :1)))\n  (<- (audio-out :2) (lopass-gate :in lpg-in :ping ping :decay (knob :y)))\n\n  (<- (led :0) (knob :main))\n  (<- (led :3) (knob :y)))\n"};</script>
<script>const __LENS_FILES = {"prelude.loupe":"; prelude.loupe -- the standard environment every patch starts with.\n; Shadowable: any def here can be redefined in a patch.\n\n; ===========================================================================\n; CONSTANTS\n; ===========================================================================\n\n(def VMAX 4095)         ; 12-bit ceiling\n(def VMID 2048)         ; bipolar centre / unipolar midpoint\n(def VMIN 0)            ; floor\n(def SMAX 2047)         ; bipolar audio peak (a signed 12-bit sample spans -SMAX..SMAX)\n(def OCTAVE 12)         ; semitones per OCTAVE\n(def MIDI-MAX 127)      ; top MIDI note (= G9); use (spread x (add MIDI-MAX 1)) to map a 0..VMAX control across all pitches\n(def half 2048)         ; VMAX / 2\n(def vmax VMAX) (def vmid VMID) (def vmin VMIN)   ; lowercase aliases\n\n; ---- rhythm + score conventions ----\n; Syms in quoted patterns env-look-up to these.\n(def x    4095)         ; beat hit  (gate high)\n(def .    0)            ; beat rest\n(def _    0)            ; score rest (no note)\n(def ~    4095)         ; score tie  (hold previous)\n\n; ===========================================================================\n; PITCH NAMES: MIDI 0..127, bound by index in chromatic order.\n; C-1=0, C4=60, G9=127. Bare C4 in any expression env-looks-up to 60.\n; (add C4 OCTAVE) = (add 60 12) = 72.\n; ===========================================================================\n\n(def (C-1 C#-1 D-1 D#-1 E-1 F-1 F#-1 G-1 G#-1 A-1 A#-1 B-1\n      C0  C#0  D0  D#0  E0  F0  F#0  G0  G#0  A0  A#0  B0\n      C1  C#1  D1  D#1  E1  F1  F#1  G1  G#1  A1  A#1  B1\n      C2  C#2  D2  D#2  E2  F2  F#2  G2  G#2  A2  A#2  B2\n      C3  C#3  D3  D#3  E3  F3  F#3  G3  G#3  A3  A#3  B3\n      C4  C#4  D4  D#4  E4  F4  F#4  G4  G#4  A4  A#4  B4\n      C5  C#5  D5  D#5  E5  F5  F#5  G5  G#5  A5  A#5  B5\n      C6  C#6  D6  D#6  E6  F6  F#6  G6  G#6  A6  A#6  B6\n      C7  C#7  D7  D#7  E7  F7  F#7  G7  G#7  A7  A#7  B7\n      C8  C#8  D8  D#8  E8  F8  F#8  G8  G#8  A8  A#8  B8\n      C9  C#9  D9  D#9  E9  F9  F#9  G9))\n\n; flat aliases: Db=C#, Eb=D#, Gb=F#, Ab=G#, Bb=A# for every octave -1..9.\n; Cb_n=B_(n-1), Fb_n=E_n for completeness.\n(def Db-1 C#-1) (def Eb-1 D#-1) (def Fb-1 E-1) (def Gb-1 F#-1) (def Ab-1 G#-1) (def Bb-1 A#-1)\n(def Cb0  B-1) (def Db0  C#0)  (def Eb0  D#0)  (def Fb0  E0)  (def Gb0  F#0)  (def Ab0  G#0)  (def Bb0  A#0)\n(def Cb1  B0)  (def Db1  C#1)  (def Eb1  D#1)  (def Fb1  E1)  (def Gb1  F#1)  (def Ab1  G#1)  (def Bb1  A#1)\n(def Cb2  B1)  (def Db2  C#2)  (def Eb2  D#2)  (def Fb2  E2)  (def Gb2  F#2)  (def Ab2  G#2)  (def Bb2  A#2)\n(def Cb3  B2)  (def Db3  C#3)  (def Eb3  D#3)  (def Fb3  E3)  (def Gb3  F#3)  (def Ab3  G#3)  (def Bb3  A#3)\n(def Cb4  B3)  (def Db4  C#4)  (def Eb4  D#4)  (def Fb4  E4)  (def Gb4  F#4)  (def Ab4  G#4)  (def Bb4  A#4)\n(def Cb5  B4)  (def Db5  C#5)  (def Eb5  D#5)  (def Fb5  E5)  (def Gb5  F#5)  (def Ab5  G#5)  (def Bb5  A#5)\n(def Cb6  B5)  (def Db6  C#6)  (def Eb6  D#6)  (def Fb6  E6)  (def Gb6  F#6)  (def Ab6  G#6)  (def Bb6  A#6)\n(def Cb7  B6)  (def Db7  C#7)  (def Eb7  D#7)  (def Fb7  E7)  (def Gb7  F#7)  (def Ab7  G#7)  (def Bb7  A#7)\n(def Cb8  B7)  (def Db8  C#8)  (def Eb8  D#8)  (def Fb8  E8)  (def Gb8  F#8)  (def Ab8  G#8)  (def Bb8  A#8)\n(def Cb9  B8)  (def Db9  C#9)  (def Eb9  D#9)  (def Fb9  E9)  (def Gb9  F#9)\n\n; ===========================================================================\n; HELPER FNS (composed from primitives)\n; ===========================================================================\n\n; value (0..VMAX) -> bipolar (-VMAX..+VMAX) signal.\n(def bipolar  (fn (:x) (sub (add x x) VMAX)))\n\n; bipolar (-VMID..+VMID) signal -> value (0..VMAX).\n(def unipolar (fn (:s) (add s VMID)))\n\n; ---- jack-boundary conversions ----\n; signed: identity for audio jacks (DAC accepts signed bipolar samples).\n(def signed     (fn (:x) x))\n; brightness: identity for LEDs (PWM accepts 0..VMAX directly).\n(def
